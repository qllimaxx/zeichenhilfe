});

/* ================= Marker (Stufe 1: erkennen und anzeigen, Foto folgt noch nicht) ================= */
const MK_W = 320;                        // Breite des verkleinerten Bildes für die Erkennung
const mkCanvas = document.createElement('canvas');
let mkCtx = null;
const markerG = $('markerG'), mRings = [...markerG.querySelectorAll('circle')], mNums = [...markerG.querySelectorAll('text')];
const markerChip = $('markerChip');
// found: Marker in Video-Pixeln {x, y, r, label}
const mkState = { found: [], blobs: 0, fps: 0, ms: 0, prev: null };
let mkRunning = false, mkLast = 0, mkCount = 0, mkCountT = 0, mkMsAvg = 0;
let learnMode = false;

function hsvCss(c){
  // HSV -> CSS-Farbe für den kleinen Farbpunkt
  const h = c.h, s = c.s, v = c.v, f = n => { const k = (n + h / 60) % 6; return v - v * s * Math.max(0, Math.min(k, 4 - k, 1)); };
  return `rgb(${Math.round(f(5) * 255)},${Math.round(f(3) * 255)},${Math.round(f(1) * 255)})`;
}
function rgbToHsv(r, g, b){
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d){
    if (max === r) h = ((g - b) / d) % 6; else if (max === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
    h *= 60; if (h < 0) h += 360;
  }
  return { h, s: max ? d / max : 0, v: max / 255 };
}
// Grenzen aus angelernter Farbe und Empfindlichkeit (1 = streng, 10 = großzügig)
function mkThresholds(){
  const c = settings.marker.color, t = settings.marker.tol;
  return { h: c.h, hTol: 6 + 3 * t,
           sMin: Math.max(0.15, c.s - (0.12 + 0.04 * t)),
           vMin: Math.max(0.12, c.v - (0.15 + 0.05 * t)) };
}
// Ein Kamerabild auswerten
function mkProcess(){
  const vw = cam.videoWidth, vh = cam.videoHeight;
  if (!vw || !vh || !settings.marker.color) return;
  const w = MK_W, h = Math.max(1, Math.round(MK_W * vh / vw)), n = w * h;
  if (mkCanvas.width !== w || mkCanvas.height !== h || !mkCtx){
    mkCanvas.width = w; mkCanvas.height = h;
    mkCtx = mkCanvas.getContext('2d', { willReadFrequently: true });
  }
  const t0 = performance.now();
  mkCtx.drawImage(cam, 0, 0, w, h);
  const data = mkCtx.getImageData(0, 0, w, h).data;
  const T = mkThresholds(), vMin = T.vMin * 255;
  // 1) Farbmaske
  const mask = new Uint8Array(n);
  for (let i = 0, p = 0; i < n; i++, p += 4){
    const r = data[p], g = data[p + 1], b = data[p + 2];
    const max = r > g ? (r > b ? r : b) : (g > b ? g : b);
    if (max < vMin) continue;
    const min = r < g ? (r < b ? r : b) : (g < b ? g : b), d = max - min;
    if (d === 0 || d < T.sMin * max) continue;
    let hh = max === r ? (g - b) / d : max === g ? (b - r) / d + 2 : (r - g) / d + 4;
    hh *= 60; if (hh < 0) hh += 360;
    let dh = hh > T.h ? hh - T.h : T.h - hh; if (dh > 180) dh = 360 - dh;
    if (dh <= T.hTol) mask[i] = 1;
  }
  // 2) zusammenhängende Flecken (4er-Nachbarschaft)
  const lab = new Uint8Array(n), stack = new Int32Array(n), blobs = [];
  for (let i = 0; i < n; i++){
    if (!mask[i] || lab[i]) continue;
    let sp = 0, area = 0, sx = 0, sy = 0, minx = w, maxx = 0, miny = h, maxy = 0;
    stack[sp++] = i; lab[i] = 1;
    while (sp){
      const j = stack[--sp], x = j % w, y = (j / w) | 0;
      area++; sx += x; sy += y;
      if (x < minx) minx = x; if (x > maxx) maxx = x; if (y < miny) miny = y; if (y > maxy) maxy = y;
      if (x > 0     && mask[j - 1] && !lab[j - 1]){ lab[j - 1] = 1; stack[sp++] = j - 1; }
      if (x < w - 1 && mask[j + 1] && !lab[j + 1]){ lab[j + 1] = 1; stack[sp++] = j + 1; }
      if (y > 0     && mask[j - w] && !lab[j - w]){ lab[j - w] = 1; stack[sp++] = j - w; }
      if (y < h - 1 && mask[j + w] && !lab[j + w]){ lab[j + w] = 1; stack[sp++] = j + w; }
    }
    blobs.push({ area, cx: sx / area + 0.5, cy: sy / area + 0.5, bw: maxx - minx + 1, bh: maxy - miny + 1 });
  }
  // 3) nach Größe und Rundheit filtern
  const minA = 8, maxA = n * 0.02;
  const cand = blobs.filter(o => {
    if (o.area < minA || o.area > maxA) return false;
    const asp = Math.max(o.bw, o.bh) / Math.min(o.bw, o.bh), fill = o.area / (o.bw * o.bh);
    return asp <= 2.5 && fill >= 0.45;
  }).sort((a, b) => b.area - a.area).slice(0, 4);
  // in Video-Pixel umrechnen
  const k = vw / w;
  const pts = cand.map(o => ({ x: o.cx * k, y: o.cy * k, r: Math.sqrt(o.area / Math.PI) * k }));
  mkState.found = orderMarkers(pts);
  mkState.blobs = blobs.length;
  // Messwerte
  const now = performance.now(), ms = now - t0;
  mkMsAvg = mkMsAvg ? mkMsAvg * 0.8 + ms * 0.2 : ms;
  mkState.ms = mkMsAvg;
  mkCount++;
  if (!mkCountT) mkCountT = now;
  if (now - mkCountT >= 1000){ mkState.fps = mkCount * 1000 / (now - mkCountT); mkCount = 0; mkCountT = now; }
  markerDraw();
}
// Feste Reihenfolge: 1 oben links, 2 oben rechts, 3 unten rechts, 4 unten links
function orderMarkers(pts){
  if (!pts.length) return [];
  if (pts.length < 4 && mkState.prev){
    // Teilweise verdeckt: Nummer des nächstgelegenen Markers aus der letzten vollständigen Erkennung übernehmen
    const used = new Set(), out = [];
    const pairs = [];
    pts.forEach((p, i) => mkState.prev.forEach(q => pairs.push({ i, label: q.label, d: Math.hypot(p.x - q.x, p.y - q.y) })));
    pairs.sort((a, b) => a.d - b.d);
    const taken = new Set();
    for (const pr of pairs){
      if (taken.has(pr.i) || used.has(pr.label)) continue;
      taken.add(pr.i); used.add(pr.label); out.push(Object.assign({}, pts[pr.i], { label: pr.label }));
    }
    return out.sort((a, b) => a.label - b.label);
  }
  if (pts.length === 3){
    // Ein Punkt fehlt und es gibt keine Vorgeschichte: fehlende Ecke als Parallelogramm-Ergänzung
    // gegenüber dem Punkt mit dem größten Innenwinkel schätzen, dann wie bei 4 Punkten nummerieren.
    let best = 0, bestAng = -1;
    for (let i = 0; i < 3; i++){
      const a = pts[(i + 1) % 3], b = pts[i], c = pts[(i + 2) % 3];
      const ang = Math.abs(Math.atan2((a.x - b.x) * (c.y - b.y) - (a.y - b.y) * (c.x - b.x), (a.x - b.x) * (c.x - b.x) + (a.y - b.y) * (c.y - b.y)));
      if (ang > bestAng){ bestAng = ang; best = i; }
    }
    const B = pts[best], A = pts[(best + 1) % 3], C = pts[(best + 2) % 3];
    const virt = { x: A.x + C.x - B.x, y: A.y + C.y - B.y, r: 0, virtual: true };
    const full = orderFour(pts.concat([virt]));
    return full.filter(p => !p.virtual);
  }
  return orderFour(pts, true);
}
function orderFour(pts, remember){
  const cx = pts.reduce((s, p) => s + p.x, 0) / pts.length, cy = pts.reduce((s, p) => s + p.y, 0) / pts.length;
  const byAngle = pts.slice().sort((a, b) => Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx));
  let start = 0;   // im Uhrzeigersinn, Start beim Punkt mit kleinstem x+y (oben links)
  byAngle.forEach((p, i) => { if (p.x + p.y < byAngle[start].x + byAngle[start].y) start = i; });
  const out = byAngle.map((p, i) => Object.assign({}, byAngle[(i + start) % byAngle.length], { label: i + 1 }));
  if (remember && out.length === 4) mkState.prev = out.map(p => ({ x: p.x, y: p.y, label: p.label }));
  return out;
}
// Ringe über dem Kamerabild (Video-Pixel -> Papier -> Bildschirm, inkl. Ansicht-Zoom)
function markerDraw(){
  const show = mkRunning && cam.videoWidth;
  markerG.style.display = show ? '' : 'none';
  applyMarkerChip();
  if (!show) return;
  const vw = cam.videoWidth, f = P.w / vw;
  for (let i = 0; i < 4; i++){
    const m = mkState.found[i];
    mRings[i].style.display = mNums[i].style.display = m ? '' : 'none';
    if (!m) continue;
    const x = V.tx + V.s * (P.left + m.x * f), y = V.ty + V.s * (P.top + m.y * f);
    const r = Math.max(9, m.r * f * V.s * 1.5 + 4);
    mRings[i].setAttribute('cx', x); mRings[i].setAttribute('cy', y); mRings[i].setAttribute('r', r);
    mNums[i].setAttribute('x', x + r * 0.75 + 2); mNums[i].setAttribute('y', y - r * 0.75 - 2);
    mNums[i].textContent = m.label;
  }
}
function applyMarkerChip(){
  const on = settings.marker.on;
  markerChip.classList.toggle('show', on);
  if (!on) return;
  markerChip.textContent = !settings.marker.color ? 'Marker: Farbe anlernen'
                         : !stream ? 'Marker: Kamera aus'
                         : mkState.found.length + '/4 Marker';
}
// Erkennung nur, wenn Marker an, Farbe angelernt, Kamera läuft und App sichtbar (Akku)
function mkWanted(){ return settings.marker.on && !!settings.marker.color && !!stream && !document.hidden; }
function mkUpdateLoop(){
  if (mkWanted()){
    if (!mkRunning){ mkRunning = true; mkCount = 0; mkCountT = 0; mkState.fps = 0; mkSchedule(); }
  } else {
    mkRunning = false; mkState.found = []; mkState.prev = null;
  }
  markerDraw();
}
function mkSchedule(){
  if (!mkRunning) return;
  if (cam.requestVideoFrameCallback) cam.requestVideoFrameCallback(mkTick);
  else requestAnimationFrame(mkTick);
}
function mkTick(){
  if (!mkRunning) return;
  const now = performance.now();
  // Abstand: mind. 40 ms (≤ 25/s) und mind. das 2,5-Fache der Rechenzeit, damit die App flüssig bleibt
  if (now - mkLast >= Math.max(40, mkMsAvg * 2.5)){
    mkLast = now;
    try { mkProcess(); } catch(e){ /* ein fehlerhaftes Bild überspringen */ }
  }
  mkSchedule();
}
document.addEventListener('visibilitychange', () => mkUpdateLoop());

// Farbe anlernen: kleiner Bereich (Radius ≈ 10 Bildschirm-px) um den Finger, Median in HSV.
// Nur die kräftigsten Pixel zählen (Sättigung ≥ 60 % der stärksten), damit Papier um einen kleinen Punkt nicht stört.
function learnAt(pt){
  hideMsg(); hideToast();
  applyLinesPanel();
  if (!stream || !cam.videoWidth){ showMsg('Kamera zuerst starten (⋯ → Kamera starten).', false); return; }
  const vw = cam.videoWidth, vh = cam.videoHeight;
  const px = (pt.x - V.tx) / V.s - P.left, py = (pt.y - V.ty) / V.s - P.top;
  if (px < 0 || py < 0 || px > P.w || py > P.h){ showMsg('Bitte direkt auf einen Punkt im Kamerabild tippen.', false); return; }
  const vx = px / P.w * vw, vy = py / P.h * vh;
  const rad = Math.max(2, Math.round(10 / V.s * vw / P.w));
  const x0 = Math.max(0, Math.round(vx - rad)), y0 = Math.max(0, Math.round(vy - rad));
  const sw = Math.min(vw - x0, 2 * rad + 1), sh = Math.min(vh - y0, 2 * rad + 1);
  try {
    const c = document.createElement('canvas'); c.width = sw; c.height = sh;
    const ctx = c.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(cam, x0, y0, sw, sh, 0, 0, sw, sh);
    const d = ctx.getImageData(0, 0, sw, sh).data, px0 = [];
    for (let y = 0; y < sh; y++) for (let x = 0; x < sw; x++){
      if (Math.hypot(x + x0 - vx, y + y0 - vy) > rad) continue;
      const p = (y * sw + x) * 4; px0.push(rgbToHsv(d[p], d[p + 1], d[p + 2]));
    }
    if (!px0.length) return;
    const sMax = Math.max(...px0.map(o => o.s));
    const sel = px0.filter(o => o.s >= sMax * 0.6);
    const hs = [], ss = [], vs = [];
    let sx = 0, sy = 0;
    for (const o of sel){
      hs.push(o.h); ss.push(o.s); vs.push(o.v);
      sx += Math.cos(o.h * Math.PI / 180) * o.s; sy += Math.sin(o.h * Math.PI / 180) * o.s;
    }
    const mean = Math.atan2(sy, sx) * 180 / Math.PI;
    const med = a => { const b = a.slice().sort((p, q) => p - q); return b[b.length >> 1]; };
    // Farbton um den (kreisförmigen) Mittelwert ausrollen, dann Median
    let h = med(hs.map(v => { let dv = v - mean; while (dv > 180) dv -= 360; while (dv < -180) dv += 360; return mean + dv; }));
    h = ((h % 360) + 360) % 360;
    const col = { h: Math.round(h * 10) / 10, s: Math.round(med(ss) * 1000) / 1000, v: Math.round(med(vs) * 1000) / 1000 };
    if (col.s < 0.15) showMsg('Diese Stelle hat kaum Farbe. Für Marker eine kräftige Farbe nehmen (z. B. Grün oder Pink).', false);
    settings.marker.color = col;
    mkState.prev = null;
    showToast(settings.marker.on ? 'Farbe angelernt' : 'Farbe angelernt – jetzt „Marker“ einschalten');
    applyLinesPanel(); mkUpdateLoop(); scheduleSave();
  } catch(e){ showMsg('Farbe konnte nicht gemessen werden.', false); }
}

$('mkPlus').addEventListener('click', () => { settings.marker.tol = Math.min(10, settings.marker.tol + 1); applyLinesPanel(); scheduleSave(); });
$('mkLearn').addEventListener('click', () => {
  if (learnMode){ learnMode = false; hideToast(); applyLinesPanel(); return; }
  if (!stream){ showMsg('Kamera zuerst starten (⋯ → Kamera starten).', false); return; }
  learnMode = true;
  panelOpen = false;                      // Feld schließen, damit die Punkte frei sichtbar sind
  applyLinesPanel();
  // Hinweis als durchlässiger Toast, damit er keinen Punkt verdeckt
  showToast('Tippe auf einen deiner Punkte im Kamerabild', 20000);
});

/* ================= Start ================= */
// Versionen vergleichen ("0.10" > "0.9")
function cmpVersion(a, b){
  const pa = String(a).split(/[.-]/), pb = String(b).split(/[.-]/);
  for (let i = 0; i < Math.max(pa.length, pb.length); i++){
    const x = parseInt(pa[i] || '0', 10) || 0, y = parseInt(pb[i] || '0', 10) || 0;
    if (x !== y) return x > y ? 1 : -1;
  }
  return 0;
}
function randomId(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';   // ohne leicht verwechselbare Zeichen
  let id = '';
  try { const a = new Uint8Array(4); crypto.getRandomValues(a); a.forEach(n => id += chars[n % chars.length]); }
  catch(e){ for (let i = 0; i < 4; i++) id += chars[Math.floor(Math.random() * chars.length)]; }
  return id;
}

// 1) Einstellungen laden (Fehler -> Standardwerte)
mergeSettings(loadSettings());
settings.ui.locked = false;              // immer entsperrt starten

// 2) Oberfläche mit (wiederhergestellten) Werten aufbauen
applyGridStyle();
applyOrientUi();
applyFocusUi();
applyInstallUi();
setOpacity(settings.photo.opacity * 100);
applyBar();
applyUi();
layout();
updateHint();

// 3) Speicher-Kennung und Update-Hinweis
(function(){
  const meta = lsGet(META_KEY);
  const m = (meta && typeof meta === 'object') ? meta : {};
  if (typeof m.id !== 'string' || !/^[A-Z0-9]{4}$/.test(m.id)) m.id = randomId();
  if (typeof m.lastVersion === 'string' && cmpVersion(APP_VERSION, m.lastVersion) > 0)
    showToast('Neue Version ' + APP_VERSION + ' geladen');
  m.lastVersion = APP_VERSION;
  lsSet(META_KEY, m);
})();

// 4) Foto, Kamera und Drehsperre wiederherstellen
(async function restore(){
  try {
    const rec = await idbGet(PHOTO_KEY);
    if (rec && rec.blob instanceof Blob && !photo.naturalWidth){
      try { await showPhotoBlob(rec.blob); requestPersist(); }
      catch(e){ /* kaputtes Foto: ignorieren */ }
    }
  } catch(e){}
  try {
    if (navigator.permissions && navigator.permissions.query){
      const st = await navigator.permissions.query({ name: 'camera' });
      if (st && st.state === 'granted' && !stream) await startCamera({ silent: true });
    }
  } catch(e){ /* nicht unterstützt: Kamera per Knopf */ }
  tryRestoreOrientLock();
})();
