<!DOCTYPE html>
<!--
  Zeichenhilfe – Overlay und Perspektive
  Autor: Benjamin Dormoros
  Version: siehe APP_VERSION im Skript (aktuell 0.8)

  Änderungsverlauf
  ----------------
  0.1 (2026-10-31)  Grundgerüst: Rückkamera bildschirmfüllend (Seitenverhältnis erhalten),
                    Foto aus der Galerie halbtransparent darüber, Deckkraft-Regler,
                    Hoch-/Querformat, ein-/ausblendbare Bedienleiste, Info-/Diagnose-Bereich,
                    Ebenen-Struktur für spätere Foto- und Ansicht-Transformation,
                    zentrales Einstellungsobjekt (noch ohne Speichern).
  0.2 (2026-10-31)  Gesten in zwei Modi: "Ausrichten" (1 Finger verschieben, 2 Finger zoomen/drehen
                    nur das Foto, Einrasten bei 0/90/180/270° ±3°, Foto zurücksetzen) und
                    "Zeichnen" (Ansicht 1×–5× zoomen und verschieben, Rand-Begrenzung,
                    Doppeltippen = 1×, Zoom-Anzeige). Sperre für alle Bild-Gesten.
                    Wake Lock (Bildschirm bleibt an) solange die Kamera läuft. Vollbild-Knopf.
                    Bedienleiste mit Symbol-Knöpfen. Ansicht-Zustand jetzt als Bildmitte relativ
                    zur Papier-Ebene + Zoomfaktor gespeichert (noch nichts dauerhaft gespeichert).
  0.3 (2026-11-01)  Installierbar und offline: Manifest (manifest.webmanifest), Service Worker (sw.js),
                    eigene App-Symbole (icon-192/512/maskable-512.png), Knopf "App installieren"
                    (im Info-Fenster, nur wenn der Browser es anbietet). Knopf "Drehung" sperrt die
                    aktuelle Bildschirmausrichtung (bei Bedarf mit Vollbild). Info: installierte App,
                    Offline-Speicher, Drehsperre.
  0.4 (2026-11-01)  Speichern und Wiederherstellen: Einstellungen automatisch (gedrosselt) in
                    localStorage (Deckkraft, Foto- und Ansicht-Transformation, Modus, Leiste,
                    Wunsch "Drehung fixiert"; die Sperre NICHT). Letztes Foto in IndexedDB (lange
                    Seite > 4096 px -> verkleinert als JPEG). navigator.storage.persist().
                    Beim Start alles wiederherstellen, Kamera-Autostart wenn Erlaubnis schon erteilt,
                    Drehsperre versuchen. Info-Fenster gegliedert in "Diagnose" und "Daten" mit
                    Speicher-Kennung, Foto-Größe, dauerhaftem Speicher, "Foto entfernen" und
                    "Alles zurücksetzen" (mit eigener Bestätigung). Hinweis "Neue Version … geladen".
                    Ansicht-Begrenzung wird nicht mehr in die gespeicherten Werte zurückgeschrieben.
  0.5 (2026-11-01)  Hilfslinien: Raster (2–12 quadratische Felder über die kurze Fotoseite, mittig,
                    Farbe Weiß/Schwarz/Rot/Blau mit Kontur, "kräftig") und Horizontlinie (über die ganze
                    Breite, Griffe zum Verschieben/Neigen, Einrasten bei 0° ±2°, Beschriftung).
                    Dritter Modus "Linien" (1 Finger: Griffe, 2 Finger: Ansicht zoomen) mit Einstellfeld.
                    Hilfslinien liegen im Foto-Koordinatensystem (ohne Foto: gedachte Fläche in
                    Papiergröße), werden in einer Bildschirm-SVG (#guideSvg) gezeichnet, deren Gruppe
                    dieselbe Ansicht- und Foto-Transformation bekommt; Strichstärke bleibt konstant
                    (vector-effect: non-scaling-stroke). Gespeichert in settings.guides.
                    Info-Fenster: "Daten" oben, "Diagnose" einklappbar.
  0.6 (2026-11-01)  Perspektive: Schalter "Perspektive" im Einstellfeld des Modus Ausrichten, 4 Eckgriffe
                    (36 px nach außen versetzt, mit Verbindungslinie), freie Ecken -> Homographie als
                    CSS matrix3d auf #photo; überschlagene/eingedellte Vierecke werden verhindert;
                    "Perspektive zurücksetzen". Hilfslinien werden jetzt Punkt für Punkt selbst in
                    Bildschirm-Koordinaten umgerechnet (gerade Linien bleiben unter einer Homographie
                    gerade) und ohne Transform gezeichnet -> überall gleich dünn. Raster nur Schwarz
                    (Standard) / Weiß ohne Kontur, Horizont ohne Kontur und ohne Beschriftung.
                    Einstellfeld (Ausrichten und Linien) einklappbar, Zustand gespeichert.
                    "Zurücks." setzt jetzt auch die Perspektive zurück.
  0.7 (2026-11-01)  Neugestaltung der Oberfläche (keine neuen Funktionen, Logik unverändert):
                    schmale senkrechte Leiste rechts (Modi, Foto, Deckkraft, Einstellungen, Sperre, Mehr)
                    mit Linien-Symbolen ohne Beschriftung, kurzer Hinweis beim Antippen; Deckkraft als
                    dünner senkrechter Regler; Mehr-Menü (Kamera, Foto/Perspektive zurücksetzen, Vollbild,
                    Drehung, Info); Moduseinstellungen als kleines Feld (Standard zu); keine Titelzeile,
                    keine Versionsanzeige; Zoom-Anzeige nur kurz beim Zoomen; im Modus Zeichnen blendet
                    ein Tipp aufs Bild die Bedienung aus/ein (Doppeltippen = 1× bleibt); einfarbig weiß
                    auf dunklem, halbtransparentem Grund; Griffe als dünne Kreise.
  0.8 (2026-11-01)  Fokus fixieren (Mehr-Menü; applyConstraints focusMode manual+focusDistance bzw.
                    single-shot, frei = continuous; Wunsch gespeichert und beim Kamerastart still
                    angewendet). Marker Stufe 1: Farbe anlernen (Tipp ins Kamerabild, Median in HSV),
                    Empfindlichkeit 1–10, Erkennung auf verkleinertem Bild (320 px Breite) mit eigener
                    Farbfilterung + zusammenhängenden Flecken + Größen-/Rundheitsfilter, max. 4 Marker in
                    fester Reihenfolge (oben links, oben rechts, unten rechts, unten links), Anzeige als
                    dünne Ringe mit Nummer und "n/4 Marker". Das Foto folgt den Markern noch NICHT.
                    Diagnose: Fokus-Modi/-Entfernung, Erkennungen/s, ms pro Bild, Flecken vor Filter.

  VERSIONSNUMMER: wird NUR hier in APP_VERSION gepflegt. sw.js erhält sie über die Adresse
  (./sw.js?v=APP_VERSION) und benennt damit seinen Cache. Zusätzliche Dateien neben index.html:
  manifest.webmanifest, sw.js, icon-192.png, icon-512.png, icon-maskable-512.png

  Ebenen-Aufbau (von außen nach innen)
  ------------------------------------
  #stage        Bildschirmfläche, schneidet ab, empfängt die Gesten
   └ #view      ANSICHT-Transformation (Zoomen/Verschieben von allem gemeinsam)
      └ #paper  "Papier-Ebene", hat exakt das Seitenverhältnis des Kamerabilds
         ├ #cam         Kamerabild
         ├ #photoLayer  FOTO-Transformation (nur das Foto verschieben/zoomen/drehen)
         │   └ #photo
         └ #guides      (leer, Platzhalter aus 0.1)
  #guideSvg     Hilfslinien über der ganzen Bildschirmfläche, alles in Bildschirm-Koordinaten.
                Abbildung Foto-Einheiten -> Bildschirm = Ansicht × Papier × Foto-Lage × Perspektive
                (computeGeom(): Matrix "Full", 3×3 projektiv). #photo bekommt dieselbe
                Perspektive als matrix3d (transform-origin 0 0).
-->
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="author" content="Benjamin Dormoros">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Zeichenhilfe</title>
<style>
  /* ===== Gestaltung 0.7: ruhig, einfarbig, Bedienung schwebt rechts über dem Bild ===== */
  :root{
    --ui-bg: rgba(18,18,18,.55);          /* halbtransparenter dunkler Grund */
    --ui-solid: rgba(20,20,20,.88);
    --fg: #fff;
    --icon: rgba(255,255,255,.9);         /* normale Symbole */
    --icon-off: rgba(255,255,255,.5);     /* inaktive Symbole */
    --muted: rgba(255,255,255,.55);
    --line: rgba(255,255,255,.1);
    --press: rgba(255,255,255,.08);
    --st: env(safe-area-inset-top, 0px);
    --sr: env(safe-area-inset-right, 0px);
    --sb: env(safe-area-inset-bottom, 0px);
    --sl: env(safe-area-inset-left, 0px);
    --rail-w: 52px;
    --rail-r: calc(10px + var(--sr));
    --pop-r: calc(var(--rail-r) + var(--rail-w) + 8px);
  }
  /* ohne Unschärfe-Effekt etwas dunkler */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))){
    :root{ --ui-bg: rgba(18,18,18,.8); }
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{
    margin:0; height:100%; overflow:hidden; background:#000; color:var(--fg);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size:14px; font-weight:400;
    overscroll-behavior:none; touch-action:none;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  body{ position:fixed; inset:0; }
  button{ font:inherit; color:inherit; }

  /* ---------- Ebenen ---------- */
  #stage{ position:absolute; inset:0; overflow:hidden; touch-action:none; background:#000; }
  #stage.locked::after{ content:""; position:absolute; inset:0; pointer-events:none;
                        box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); }   /* Sperre: nur feine Andeutung */
  /* Ursprung oben links: Bildschirm = Verschiebung + Zoom × Position */
  #view{ position:absolute; inset:0; transform-origin:0 0; }
  /* will-change nur während einer Geste, danach wird wieder scharf gerendert */
  #view.moving, #photoLayer.moving{ will-change:transform; }
  #paper{ position:absolute; left:0; top:0; overflow:hidden; background:#151515; }
  #cam{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; display:none; }
  #photoLayer{ position:absolute; inset:0; transform-origin:50% 50%; pointer-events:none; }
  #photo{ position:absolute; left:0; top:0; transform-origin:0 0;
          max-width:none; max-height:none; display:none; opacity:.5; }
  #guides{ position:absolute; inset:0; pointer-events:none; }
  #hint{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
         padding:24px 80px 24px 24px; text-align:center; color:var(--muted); font-size:14px; line-height:1.5;
         pointer-events:none; }

  /* ---------- Hilfslinien ---------- */
  #guideSvg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:hidden; }
  #guideSvg .ln{ fill:none; stroke-linecap:butt; }
  #guideSvg .handle{ fill:none; stroke:rgba(255,255,255,.9); stroke-width:1.25px; }
  #guideSvg .cLink{ stroke:rgba(255,255,255,.45); stroke-width:1px; }

  /* ---------- schwebende Flächen ---------- */
  .glass{ background:var(--ui-bg); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
          box-shadow:0 6px 24px rgba(0,0,0,.22); }

  /* ---------- Leiste rechts (Hoch- und Querformat) ---------- */
  #bar{
    position:absolute; z-index:10; right:var(--rail-r); top:50%; transform:translateY(-50%);
    width:var(--rail-w); padding:4px; border-radius:26px;
    display:flex; flex-direction:column; align-items:center;
    touch-action:manipulation; transition:opacity .2s ease, transform .2s ease;
  }
  #bar.hidden{ opacity:0; pointer-events:none; transform:translateY(-50%) translateX(10px); }
  .ic{ position:relative; width:44px; height:44px; padding:0; border:0; border-radius:50%; background:none;
       color:var(--icon); display:flex; align-items:center; justify-content:center; cursor:pointer;
       touch-action:manipulation; }
  .ic svg{ width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.75;
           stroke-linecap:round; stroke-linejoin:round; }
  .ic:active{ background:var(--press); }
  .ic:disabled{ opacity:.3; }
  .ic.mode{ color:var(--icon-off); }
  .ic.on{ color:#fff; }
  /* aktiv: kleiner weißer Punkt links neben dem Symbol */
  .ic.on::after{ content:""; position:absolute; left:1px; top:50%; width:4px; height:4px; margin-top:-2px;
                 border-radius:50%; background:#fff; }
  .ic.dot::before{ content:""; position:absolute; right:9px; top:9px; width:5px; height:5px; border-radius:50%;
                   background:#fff; }
  .sep{ width:18px; height:1px; margin:4px 0; background:var(--line); }

  /* ausgeblendet: winziger Punkt am rechten Rand */
  #barToggle{ position:absolute; z-index:10; right:calc(2px + var(--sr)); top:50%; width:44px; height:44px;
              margin-top:-22px; padding:0; border:0; background:none; display:none; cursor:pointer; }
  #barToggle::after{ content:""; position:absolute; right:8px; top:50%; width:6px; height:6px; margin-top:-3px;
                     border-radius:50%; background:rgba(255,255,255,.45); }
  #barToggle.show{ display:block; animation:fadeIn .25s ease; }
  @keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }

  /* kurzer Hinweis beim Antippen eines Symbols */
  #railTip{ position:absolute; z-index:12; right:var(--pop-r); padding:4px 10px; border-radius:10px;
            font-size:13px; white-space:nowrap; pointer-events:none; opacity:0; transition:opacity .15s; }
  #railTip.show{ opacity:1; }

  /* ---------- Felder neben der Leiste ---------- */
  .pop{ position:absolute; z-index:11; right:var(--pop-r); border-radius:16px; padding:6px;
        display:none; touch-action:manipulation; }
  .pop.show{ display:block; animation:fadeIn .15s ease; }
  /* Deckkraft: dünner senkrechter Regler */
  #opPop{ width:52px; padding:8px 4px; text-align:center; }
  #opVal{ display:block; font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums; margin-bottom:4px; }
  #opacity{ writing-mode:vertical-lr; direction:rtl; width:44px; height:150px; margin:0; accent-color:#fff;
            touch-action:none; cursor:pointer; }
  /* Mehr-Menü */
  #moreMenu{ width:252px; }
  #camBtn.on::after{ display:none; }
  .mi{ display:flex; align-items:center; gap:12px; width:100%; min-height:44px; padding:0 12px 0 10px;
       border:0; border-radius:10px; background:none; color:var(--icon); text-align:left; cursor:pointer; }
  .mi svg{ width:20px; height:20px; flex:none; fill:none; stroke:currentColor; stroke-width:1.75;
           stroke-linecap:round; stroke-linejoin:round; }
  .mi:active{ background:var(--press); }
  .mi:disabled{ opacity:.35; }
  .mi span{ flex:1; }
  .mi.on::after{ content:""; width:5px; height:5px; border-radius:50%; background:#fff; }
  .mi.dot::after{ content:""; width:5px; height:5px; border-radius:50%; background:#fff; }
  /* Moduseinstellungen */
  #modePanel{ width:240px; }
  .pb, .sw{ flex:none; }
  .pt{ display:flex; align-items:center; width:100%; min-height:44px; padding:0 12px; border:0; border-radius:10px;
       background:none; color:var(--icon-off); text-align:left; cursor:pointer; }
  .pt:active, .pb:active{ background:var(--press); }
  .pt:disabled{ opacity:.35; }
  .pt span{ flex:1; }
  .pt i{ width:8px; height:8px; border-radius:50%; box-shadow:inset 0 0 0 1.25px rgba(255,255,255,.5); }
  .pt.on{ color:#fff; }
  .pt.on i{ background:#fff; box-shadow:none; }
  .pt.act{ color:var(--icon); }
  .prow{ display:flex; align-items:center; min-height:44px; padding-left:12px; color:var(--icon-off); }
  .prow .pl{ flex:1; }
  .pb{ width:44px; height:44px; padding:0; border:0; border-radius:50%; background:none; color:var(--icon);
       font-size:18px; cursor:pointer; }
  .pb:disabled{ opacity:.3; }
  #gN{ min-width:24px; text-align:center; color:#fff; font-variant-numeric:tabular-nums; }
  .sw{ position:relative; width:44px; height:44px; padding:0; border:0; background:none; cursor:pointer; }
  .sw i{ position:absolute; left:50%; top:50%; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%;
         box-shadow:0 0 0 1px rgba(255,255,255,.35); }
  .sw.on i{ box-shadow:0 0 0 1.5px rgba(18,18,18,1), 0 0 0 3px #fff; }
  .psep{ height:1px; margin:4px 8px; background:var(--line); }

  /* Zoom-Anzeige: klein, nur kurz beim Zoomen */
  #chipZoom{ position:absolute; z-index:9; top:calc(12px + var(--st)); left:50%; transform:translateX(-50%);
             padding:3px 8px; border-radius:10px; background:rgba(0,0,0,.35); color:rgba(255,255,255,.85);
             font-size:12px; font-variant-numeric:tabular-nums; pointer-events:none; transition:opacity .3s; }
  #chipZoom.hide{ opacity:0; }
  /* Marker */
  #markerG{ filter:drop-shadow(0 0 1px rgba(0,0,0,.85)); }   /* feiner dunkler Saum: Ring auch auf weißem Papier sichtbar */
  #guideSvg .mring{ fill:none; stroke:rgba(255,255,255,.95); stroke-width:1.25px; }
  #guideSvg .mnum{ font-size:10px; fill:#fff; paint-order:stroke; stroke:rgba(0,0,0,.45); stroke-width:2px; }
  #markerChip{ position:absolute; z-index:9; left:calc(12px + var(--sl)); top:calc(12px + var(--st));
               padding:3px 8px; border-radius:10px; background:rgba(0,0,0,.35); color:rgba(255,255,255,.85);
               font-size:12px; font-variant-numeric:tabular-nums; pointer-events:none; display:none; }
  #markerChip.show{ display:block; }
  .mk-sw{ width:14px; height:14px; border-radius:50%; box-shadow:0 0 0 1px rgba(255,255,255,.4); }

  /* ---------- Meldungen, Info, Bestätigung ---------- */
  .btn{ min-height:44px; padding:0 14px; border:0; border-radius:12px; background:rgba(255,255,255,.08);
        color:var(--fg); font-size:14px; cursor:pointer; touch-action:manipulation; }
  .btn:active{ background:rgba(255,255,255,.16); }
  .btn:disabled{ opacity:.35; }
  #msg{
    position:absolute; z-index:20; left:50%; top:calc(16px + var(--st)); transform:translateX(-50%);
    width:min(calc(100vw - 100px), 420px); margin-left:-30px; padding:10px 44px 10px 14px; border-radius:14px;
    background:var(--ui-solid); font-size:14px; line-height:1.4; display:none;
  }
  #msg.show{ display:block; }
  #msgClose{ position:absolute; top:0; right:0; width:44px; height:44px; background:none; border:0;
             color:var(--muted); font-size:18px; }
  #info{
    position:absolute; z-index:30; left:50%; top:50%; transform:translate(-50%,-50%);
    width:min(92vw, 360px); max-height:88vh; overflow:auto; padding:16px; border-radius:18px;
    background:var(--ui-solid); -webkit-backdrop-filter:blur(14px); backdrop-filter:blur(14px);
    box-shadow:0 8px 30px rgba(0,0,0,.3); display:none; touch-action:pan-y;
  }
  #info.show{ display:block; }
  #info h2{ margin:0 0 8px; font-size:16px; font-weight:400; }
  #info h3{ margin:12px 0 2px; font-size:12px; font-weight:400; color:var(--muted); }
  #diagBox{ margin-top:10px; }
  #diagBox summary{ min-height:44px; display:flex; align-items:center; cursor:pointer; font-size:12px;
                    color:var(--muted); list-style:none; }
  #diagBox summary::-webkit-details-marker{ display:none; }
  .infoBtns{ display:flex; gap:8px; margin-top:10px; }
  .infoBtns .btn{ flex:1; padding:0 8px; }
  #confirmBox{ display:none; margin-top:10px; padding:12px; border-radius:12px; background:rgba(255,255,255,.06);
               font-size:14px; line-height:1.4; }
  #confirmBox.show{ display:block; }
  #toast{ position:absolute; z-index:25; left:50%; top:calc(16px + var(--st)); transform:translateX(-50%);
          padding:5px 12px; border-radius:12px; background:rgba(0,0,0,.55); font-size:13px; color:rgba(255,255,255,.85);
          opacity:0; transition:opacity .4s; pointer-events:none; white-space:nowrap; }
  #toast.show{ opacity:1; }
  #info table{ width:100%; border-collapse:collapse; font-size:13px; }
  #info td{ padding:6px 0; border-bottom:1px solid var(--line); vertical-align:top; }
  #info td:first-child{ color:var(--muted); padding-right:10px; }
  .ja{ color:#fff; } .nein{ color:var(--muted); }
  #installBtn{ width:100%; margin-top:10px; display:none; }
  #installBtn.show{ display:block; }
  #infoClose{ margin-top:10px; width:100%; }
  #file{ display:none; }
</style>
</head>
<body>

<div id="stage">
  <div id="view">
    <div id="paper">
      <video id="cam" playsinline muted autoplay></video>
      <div id="photoLayer"><img id="photo" alt="Vorlage"></div>
      <div id="guides"></div>
    </div>
  </div>
  <svg id="guideSvg" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path id="gridLine" class="ln" d=""/>
    <path id="horLine" class="ln" stroke="#ffc400" stroke-width="2" d=""/>
    <g id="handles">
      <circle id="hMid" class="handle mid" r="7"/>
      <circle id="hEndA" class="handle" r="6"/>
      <circle id="hEndB" class="handle" r="6"/>
    </g>
    <g id="cornerHandles">
      <line class="cLink"/><line class="cLink"/><line class="cLink"/><line class="cLink"/>
      <circle class="handle corner" r="7"/><circle class="handle corner" r="7"/>
      <circle class="handle corner" r="7"/><circle class="handle corner" r="7"/>
    </g>
    <g id="markerG">
      <circle class="mring" r="10"/><circle class="mring" r="10"/><circle class="mring" r="10"/><circle class="mring" r="10"/>
      <text class="mnum">1</text><text class="mnum">2</text><text class="mnum">3</text><text class="mnum">4</text>
    </g>
  </svg>
  <div id="hint">Foto wählen: Bild-Symbol rechts.<br>Kamera: ⋯ → Kamera starten.</div>
</div>

<div id="chipZoom" class="hide">1×</div>
<div id="markerChip">0/4 Marker</div>
<button id="barToggle" aria-label="Bedienung einblenden"></button>
<div id="railTip" class="glass"></div>

<!-- Leiste rechts: Modi, Foto, Deckkraft, Einstellungen, Sperre, Mehr -->
<div id="bar" class="glass" role="toolbar" aria-label="Bedienung">
  <button id="modeAlign" class="ic mode on" data-tip="Ausrichten" aria-label="Ausrichten" aria-pressed="true">
    <svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M9.5 5.5L12 3l2.5 2.5M9.5 18.5L12 21l2.5-2.5M5.5 9.5L3 12l2.5 2.5M18.5 9.5L21 12l-2.5 2.5"/></svg>
  </button>
  <button id="modeLines" class="ic mode" data-tip="Linien" aria-label="Linien" aria-pressed="false">
    <svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="1.5"/><path d="M4 12h16M12 4v16"/></svg>

<script>
'use strict';
/* ================= Version und Einstellungen ================= */
const APP_VERSION = '0.8';         // EINZIGE Stelle für die Versionsnummer (sw.js bekommt sie per ?v=)
const SETTINGS_FORMAT = 1;          // Format des Einstellungsobjekts; nur abwärtskompatibel ändern
const STORAGE_KEY = 'zeichenhilfe.settings';

// Zentrales Einstellungsobjekt. Alles relativ zur Papier-Ebene, damit Drehen und Vollbild nichts verschieben.
const settings = {
  formatVersion: SETTINGS_FORMAT,
  appVersion: APP_VERSION,
  // Foto: x/y = Verschiebung der Fotomitte als Anteil von Papierbreite/-höhe,
  // scale = Faktor zur "passt ganz hinein"-Größe, rotation in Grad
  // corners: Verschiebung der 4 Ecken (oben links, oben rechts, unten rechts, unten links) in Foto-Einheiten
  photo: { opacity: 0.5, x: 0, y: 0, scale: 1, rotation: 0, corners: [[0,0],[0,0],[0,0],[0,0]] },
  // Ansicht: cx/cy = Papierpunkt (Anteil 0..1) in der Bildschirmmitte, scale = Zoom 1..5
  view:  { cx: 0.5, cy: 0.5, scale: 1 },
  ui:    { barVisible: true, mode: 'align', locked: false, orientFixed: false, perspOn: false, panelCollapsed: false, focusFixed: false },
  // Marker: angelernte Farbe (HSV, h 0..360, s/v 0..1) und Empfindlichkeit 1..10
  marker: { on: false, color: null, tol: 5 },  // locked wird NICHT gespeichert
  // Hilfslinien im Foto-Koordinatensystem. Einheit: kurze Fotoseite = 1, Ursprung = Fotomitte.
  guides: {
    grid:    { on: false, n: 4, color: 'black', bold: false },
    horizon: { on: false, u: 0, v: 0, angle: 0 }   // Punkt auf der Linie (u,v) + Winkel im Foto (Grad)
  }
};
const GRID_COLORS = { black: '#000000', white: '#ffffff' };
const GRID_N_MIN = 2, GRID_N_MAX = 12;
const HOR_SNAP_DEG = 2;
const VIEW_MIN = 1, VIEW_MAX = 5;
const PHOTO_MIN = 0.05, PHOTO_MAX = 20;
const SNAP_DEG = 3;

/* ---------- Einstellungen speichern (localStorage) ---------- */
const META_KEY = 'zeichenhilfe.meta';   // Speicher-Kennung + zuletzt gestartete Version
let storageBlocked = false;             // true nach "Alles zurücksetzen" (nichts mehr schreiben)

function lsGet(key){
  try { const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }               // kein Zugriff oder kaputtes JSON
}
function lsSet(key, obj){
  if (storageBlocked) return false;
  try { localStorage.setItem(key, JSON.stringify(obj)); return true; }
  catch(e){ return false; }
}
function loadSettings(){ return lsGet(STORAGE_KEY); }
function saveSettings(){
  // Nur das Nötige speichern; die Sperre (ui.locked) bewusst nicht
  const p = settings.photo, v = settings.view, u = settings.ui;
  return lsSet(STORAGE_KEY, {
    formatVersion: SETTINGS_FORMAT, appVersion: APP_VERSION,
    photo: { opacity: p.opacity, x: p.x, y: p.y, scale: p.scale, rotation: p.rotation, corners: p.corners.map(c => [c[0], c[1]]) },
    view:  { cx: v.cx, cy: v.cy, scale: v.scale },
    ui:    { barVisible: u.barVisible, mode: u.mode, orientFixed: u.orientFixed, perspOn: u.perspOn, panelCollapsed: u.panelCollapsed, focusFixed: u.focusFixed },
    marker: { on: settings.marker.on, color: settings.marker.color ? Object.assign({}, settings.marker.color) : null, tol: settings.marker.tol },
    guides: JSON.parse(JSON.stringify(settings.guides))
  });
}
// Gespeicherte Werte übernehmen. Fehlende/ungültige Felder behalten den Standardwert.
// Unbekannte (neuere) Formate oder Nicht-Objekte werden ganz ignoriert.
function mergeSettings(raw){
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return false;
  if (raw.formatVersion !== undefined &&
      (typeof raw.formatVersion !== 'number' || raw.formatVersion > SETTINGS_FORMAT)) return false;
  const num = (v, min, max, def) => (typeof v === 'number' && isFinite(v)) ? Math.min(max, Math.max(min, v)) : def;
  const obj = o => (o && typeof o === 'object') ? o : {};
  const p = obj(raw.photo), v = obj(raw.view), u = obj(raw.ui), S = settings;
  S.photo.opacity  = num(p.opacity, 0, 1, S.photo.opacity);
  S.photo.x        = num(p.x, -10, 10, S.photo.x);
  S.photo.y        = num(p.y, -10, 10, S.photo.y);
  S.photo.scale    = num(p.scale, PHOTO_MIN, PHOTO_MAX, S.photo.scale);
  S.photo.rotation = num(p.rotation, -36000, 36000, S.photo.rotation);
  S.view.cx        = num(v.cx, -1, 2, S.view.cx);
  S.view.cy        = num(v.cy, -1, 2, S.view.cy);
  S.view.scale     = num(v.scale, VIEW_MIN, VIEW_MAX, S.view.scale);
  if (typeof u.barVisible === 'boolean') S.ui.barVisible = u.barVisible;
  if (u.mode === 'align' || u.mode === 'draw' || u.mode === 'lines') S.ui.mode = u.mode;
  const g = obj(raw.guides), gg = obj(g.grid), gh = obj(g.horizon);
  if (typeof gg.on === 'boolean') S.guides.grid.on = gg.on;
  S.guides.grid.n = Math.round(num(gg.n, GRID_N_MIN, GRID_N_MAX, S.guides.grid.n));
  if (typeof gg.color === 'string') S.guides.grid.color = GRID_COLORS[gg.color] ? gg.color : 'black';   // alte Farben Rot/Blau -> Schwarz
  if (typeof u.perspOn === 'boolean') S.ui.perspOn = u.perspOn;
  if (typeof u.panelCollapsed === 'boolean') S.ui.panelCollapsed = u.panelCollapsed;
  if (typeof u.focusFixed === 'boolean') S.ui.focusFixed = u.focusFixed;
  const mk = obj(raw.marker);
  if (typeof mk.on === 'boolean') S.marker.on = mk.on;
  S.marker.tol = Math.round(num(mk.tol, 1, 10, S.marker.tol));
  const mc = mk.color;
  if (mc && typeof mc === 'object' && [mc.h, mc.s, mc.v].every(n => typeof n === 'number' && isFinite(n)))
    S.marker.color = { h: ((mc.h % 360) + 360) % 360, s: Math.min(1, Math.max(0, mc.s)), v: Math.min(1, Math.max(0, mc.v)) };
  if (Array.isArray(p.corners) && p.corners.length === 4 &&
      p.corners.every(c => Array.isArray(c) && c.length === 2 && c.every(n => typeof n === 'number' && isFinite(n) && Math.abs(n) <= 10)))
    S.photo.corners = p.corners.map(c => [c[0], c[1]]);
  if (typeof gg.bold === 'boolean') S.guides.grid.bold = gg.bold;
  if (typeof gh.on === 'boolean') S.guides.horizon.on = gh.on;
  S.guides.horizon.u     = num(gh.u, -100, 100, S.guides.horizon.u);
  S.guides.horizon.v     = num(gh.v, -100, 100, S.guides.horizon.v);
  S.guides.horizon.angle = num(gh.angle, -360, 360, S.guides.horizon.angle);
  if (typeof u.orientFixed === 'boolean') S.ui.orientFixed = u.orientFixed;
  return true;
}
// Gedrosselt speichern: erst wenn kurz Ruhe ist
let saveTimer = null;
function scheduleSave(delay){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saveTimer = null; saveSettings(); }, delay == null ? 400 : delay);
}
function flushSave(){
  if (saveTimer){ clearTimeout(saveTimer); saveTimer = null; saveSettings(); }
}

/* ---------- Foto speichern (IndexedDB) ---------- */
const DB_NAME = 'zeichenhilfe', DB_STORE = 'data', PHOTO_KEY = 'photo';
const PHOTO_MAX_SIDE = 4096;
function idbOpen(){
  return new Promise((resolve, reject) => {
    try {
      const r = indexedDB.open(DB_NAME, 1);
      r.onupgradeneeded = () => { try { r.result.createObjectStore(DB_STORE); } catch(e){} };
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
      r.onblocked = () => reject(new Error('blockiert'));
    } catch(e){ reject(e); }
  });
}
async function idbDo(mode, fn){
  const db = await idbOpen();
  try {
    return await new Promise((resolve, reject) => {
      const tx = db.transaction(DB_STORE, mode);
      let result;
      const q = fn(tx.objectStore(DB_STORE));
      q.onsuccess = () => { result = q.result; };
      tx.oncomplete = () => resolve(result);
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error);
    });
  } finally { try { db.close(); } catch(e){} }
}
async function idbGet(key){ try { return await idbDo('readonly', s => s.get(key)); } catch(e){ return null; } }
async function idbPut(key, val){ if (storageBlocked) return false; try { await idbDo('readwrite', s => s.put(val, key)); return true; } catch(e){ return false; } }
async function idbDel(key){ try { await idbDo('readwrite', s => s.delete(key)); return true; } catch(e){ return false; } }
async function idbClear(){ try { await idbDo('readwrite', s => s.clear()); return true; } catch(e){ return false; } }

/* ---------- Dauerhafter Speicher ---------- */
async function requestPersist(){
  try { if (navigator.storage && navigator.storage.persist && !(await navigator.storage.persisted())) await navigator.storage.persist(); }
  catch(e){}
}
async function isPersisted(){
  try { return (navigator.storage && navigator.storage.persisted) ? await navigator.storage.persisted() : null; }
  catch(e){ return null; }
}

/* ================= Elemente ================= */
const $ = id => document.getElementById(id);
const stage = $('stage'), view = $('view'), paper = $('paper'), cam = $('cam');
const photoLayer = $('photoLayer'), photo = $('photo'), hint = $('hint');
const bar = $('bar'), camBtn = $('camBtn'), photoBtn = $('photoBtn'), fileIn = $('file');
const opacity = $('opacity'), opVal = $('opVal'), infoBtn = $('infoBtn');
const resetBtn = $('resetBtn'), lockBtn = $('lockBtn'), fsBtn = $('fsBtn');
const modeAlign = $('modeAlign'), modeDraw = $('modeDraw'), modeLines = $('modeLines');
const chipZoom = $('chipZoom');
const opBtn = $('opBtn'), setBtn = $('setBtn'), moreBtn = $('moreBtn');
const opPop = $('opPop'), moreMenu = $('moreMenu'), railTip = $('railTip');
const msg = $('msg'), msgText = $('msgText'), info = $('info'), infoBody = $('infoBody'), dataBody = $('dataBody');

let stream = null;
let camWasRunning = false;
let photoUrl = null;
// Papier-Geometrie in Stage-Pixeln (ohne Ansicht-Zoom)
let P = { w: 0, h: 0, left: 0, top: 0 };
// Aktuelle Ansicht in Pixeln: Bildschirm = (tx,ty) + s × Stage-Position
let V = { s: 1, tx: 0, ty: 0 };

/* ================= Meldungen ================= */
function showMsg(text, isError){
  msgText.textContent = text;
  msg.classList.toggle('error', !!isError);
  msg.classList.add('show');
}
function hideMsg(){ msg.classList.remove('show'); }
$('msgClose').addEventListener('click', hideMsg);

/* ================= Layout und Transformationen ================= */
function layout(){
  const sw = stage.clientWidth, sh = stage.clientHeight;
  let aw = sw, ah = sh;                                  // ohne Kamera: Papier = Bildschirm
  if (stream && cam.videoWidth && cam.videoHeight){ aw = cam.videoWidth; ah = cam.videoHeight; }
  const s = Math.min(sw / aw, sh / ah);
  const pw = Math.round(aw * s), ph = Math.round(ah * s);
  P = { w: pw, h: ph, left: Math.round((sw - pw) / 2), top: Math.round((sh - ph) / 2) };
  paper.style.width = pw + 'px';
  paper.style.height = ph + 'px';
  paper.style.left = P.left + 'px';
  paper.style.top = P.top + 'px';
  fitPhoto();
  applyPhotoTransform();
  applyViewTransform();
  if (typeof applyLinesPanel === 'function' && modePanel) applyLinesPanel();
}

// Grundgröße: Foto so groß wie möglich, ganz sichtbar, mittig in der Papier-Ebene
function fitPhoto(){
  if (!photo.naturalWidth) return;
  const s = Math.min(P.w / photo.naturalWidth, P.h / photo.naturalHeight);
  photo.style.width = (photo.naturalWidth * s) + 'px';
  photo.style.height = (photo.naturalHeight * s) + 'px';
}

// a) Foto-Transformation – wirkt nur auf das Foto
function applyPhotoTransform(){
  const p = settings.photo;
  photoLayer.style.transform =
    `translate(${p.x * P.w}px, ${p.y * P.h}px) rotate(${p.rotation}deg) scale(${p.scale})`;
  photo.style.opacity = p.opacity;
  applyPhotoPerspective();
  updateGuides();
}

// Ansicht begrenzen: Papier darf nicht vom Rand weggeschoben werden; ist es kleiner als der
// Bildschirm, bleibt es in dieser Richtung mittig.
function clampView(v){
  const sw = stage.clientWidth, sh = stage.clientHeight;
  v.s = Math.min(VIEW_MAX, Math.max(VIEW_MIN, v.s));
  const W = v.s * P.w, H = v.s * P.h;
  let L = v.tx + v.s * P.left, T = v.ty + v.s * P.top;
  L = (W >= sw) ? Math.min(0, Math.max(sw - W, L)) : (sw - W) / 2;
  T = (H >= sh) ? Math.min(0, Math.max(sh - H, T)) : (sh - H) / 2;
  v.tx = L - v.s * P.left;
  v.ty = T - v.s * P.top;
  return v;
}
// settings.view (relativ) -> Pixel
function viewFromSettings(){
  const sw = stage.clientWidth, sh = stage.clientHeight, v = settings.view;
  const s = v.scale;
  return clampView({ s, tx: sw / 2 - s * (P.left + v.cx * P.w), ty: sh / 2 - s * (P.top + v.cy * P.h) });
}
// Pixel -> settings.view (relativ)
function storeView(v){
  const sw = stage.clientWidth, sh = stage.clientHeight;
  settings.view.scale = v.s;
  settings.view.cx = P.w ? ((sw / 2 - v.tx) / v.s - P.left) / P.w : 0.5;
  settings.view.cy = P.h ? ((sh / 2 - v.ty) / v.s - P.top) / P.h : 0.5;
}

// b) Ansicht-Transformation – wirkt auf Kamerabild + Foto + Hilfslinien gemeinsam
function applyViewTransform(){
  V = viewFromSettings();   // Begrenzung nur für die Anzeige; gespeicherte Werte bleiben unverändert
  view.style.transform = `translate(${V.tx}px, ${V.ty}px) scale(${V.s})`;
  flashZoom(V.s);
  updateGuides();
}

// Zoom-Anzeige nur während/kurz nach dem Zoomen
let lastZoomShown = null, zoomTimer = null;
function flashZoom(z){
  if (lastZoomShown === null){ lastZoomShown = z; return; }
  if (Math.abs(z - lastZoomShown) < 1e-6) return;
  lastZoomShown = z;
  clearTimeout(zoomTimer);
  if (z <= 1.001){ chipZoom.classList.add('hide'); return; }
  chipZoom.textContent = z.toFixed(1).replace('.', ',') + '×';
  chipZoom.classList.remove('hide');
  zoomTimer = setTimeout(() => chipZoom.classList.add('hide'), 1200);
}

function updateHint(){
  hint.style.display = (stream || photo.naturalWidth) ? 'none' : 'flex';
}

let layoutTimer = null;
function scheduleLayout(){
  layout();
  clearTimeout(layoutTimer);
  layoutTimer = setTimeout(layout, 300);   // nach Drehung nochmals, falls Maße verzögert ankommen
}
window.addEventListener('resize', scheduleLayout);
window.addEventListener('orientationchange', scheduleLayout);
cam.addEventListener('loadedmetadata', scheduleLayout);
cam.addEventListener('resize', scheduleLayout);   // Kamerabild ändert Maße (z. B. beim Drehen)

/* ================= Hilfslinien und Perspektive ================= */
const guideSvg = $('guideSvg'), gridLine = $('gridLine'), horLine = $('horLine');
const handlesG = $('handles'), hMid = $('hMid'), hEndA = $('hEndA'), hEndB = $('hEndB');
const cornerG = $('cornerHandles');
const cLinks = [...cornerG.querySelectorAll('line')], cDots = [...cornerG.querySelectorAll('circle')];
const modePanel = $('modePanel');
let gridSegs = [], gridKey = '';
const HANDLE_DIST = 90;      // Abstand der Horizont-Endgriffe vom Mittelgriff (Bildschirm-px)
const HANDLE_HIT = 26;       // Greif-Radius (≈ 52 px Fläche)
const CORNER_OFF = 36;       // Eckgriffe so weit diagonal nach außen versetzt (px)
const ID3 = [1,0,0, 0,1,0, 0,0,1];

/* ---------- 3×3-Matrizen (zeilenweise) ---------- */
function m3mul(A, B){
  const r = new Array(9);
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++)
    r[i*3+j] = A[i*3] * B[j] + A[i*3+1] * B[3+j] + A[i*3+2] * B[6+j];
  return r;
}
function m3inv(m){
  const [a,b,c,d,e,f,g,h,i] = m;
  const A = e*i - f*h, B = -(d*i - f*g), C = d*h - e*g, det = a*A + b*B + c*C;
  if (!isFinite(det) || Math.abs(det) < 1e-14) return null;
  return [A/det, -(b*i - c*h)/det, (b*f - c*e)/det,
          B/det,  (a*i - c*g)/det, -(a*f - c*d)/det,
          C/det, -(a*h - b*g)/det,  (a*e - b*d)/det];
}
// Punkt abbilden (mit Perspektiv-Division); null, wenn der Punkt "hinter" der Abbildung liegt
function m3apply(m, x, y){
  const w = m[6]*x + m[7]*y + m[8];
  if (!(w > 1e-9)) return null;
  return { x: (m[0]*x + m[1]*y + m[2]) / w, y: (m[3]*x + m[4]*y + m[5]) / w };
}
// Vorzeichen so wählen, dass ein Referenzpunkt w > 0 hat
function m3orient(m, x, y){
  if (!m) return null;
  return (m[6]*x + m[7]*y + m[8]) < 0 ? m.map(v => -v) : m;
}
// Homographie aus 4 Punktpaaren (lineares Gleichungssystem 8×8, Gauß mit Pivotsuche)
function solveHomography(src, dst){
  const A = [], b = [];
  for (let i = 0; i < 4; i++){
    const [x, y] = src[i], [X, Y] = dst[i];
    A.push([x, y, 1, 0, 0, 0, -x*X, -y*X]); b.push(X);
    A.push([0, 0, 0, x, y, 1, -x*Y, -y*Y]); b.push(Y);
  }
  for (let c = 0; c < 8; c++){
    let piv = c;
    for (let r = c + 1; r < 8; r++) if (Math.abs(A[r][c]) > Math.abs(A[piv][c])) piv = r;
    if (Math.abs(A[piv][c]) < 1e-12) return null;
    [A[c], A[piv]] = [A[piv], A[c]]; [b[c], b[piv]] = [b[piv], b[c]];
    for (let r = 0; r < 8; r++){
      if (r === c) continue;
      const f = A[r][c] / A[c][c];
      if (!f) continue;
      for (let k = c; k < 8; k++) A[r][k] -= f * A[c][k];
      b[r] -= f * b[c];
    }
  }
  const h = b.map((v, i) => v / A[i][i]);
  return [h[0], h[1], h[2], h[3], h[4], h[5], h[6], h[7], 1];
}

/* ---------- Foto-Fläche und Perspektive ---------- */
// Fotofläche in "passt hinein"-Größe (ohne Foto: gedachte Fläche = Papier)
function photoFrame(){
  let fw = P.w, fh = P.h;
  if (photo.naturalWidth){
    const k = Math.min(P.w / photo.naturalWidth, P.h / photo.naturalHeight);
    fw = photo.naturalWidth * k; fh = photo.naturalHeight * k;
  }
  const s0 = Math.max(1e-6, Math.min(fw, fh));
  return { s0, aw: fw / s0, ah: fh / s0 };   // aw/ah = Seitenlängen in Einheiten der kurzen Seite
}
function rectCorners(F){ const hw = F.aw / 2, hh = F.ah / 2; return [[-hw,-hh],[hw,-hh],[hw,hh],[-hw,hh]]; }
function quadFrom(F, corners){ return rectCorners(F).map((c, i) => [c[0] + corners[i][0], c[1] + corners[i][1]]); }
// Gültig = konvex und nicht überschlagen (alle Kreuzprodukte positiv wie beim Rechteck)
function quadValid(Q){
  for (let i = 0; i < 4; i++){
    const a = Q[i], b = Q[(i+1) % 4], c = Q[(i+2) % 4];
    const cr = (b[0]-a[0]) * (c[1]-b[1]) - (b[1]-a[1]) * (c[0]-b[0]);
    if (!(cr > 1e-3)) return false;
  }
  return true;
}
const isRect = cs => cs.every(c => c[0] === 0 && c[1] === 0);
// Perspektive in Foto-Einheiten: Rechteck -> Viereck
function perspHomography(F){
  const cs = settings.photo.corners;
  if (isRect(cs)) return ID3;
  const Q = quadFrom(F, cs);
  if (!quadValid(Q)) return ID3;
  return solveHomography(rectCorners(F), Q) || ID3;
}
// #photo: Bildpixel -> Pixel der Foto-Ebene (Mitte der Ebene = Fotomitte) als matrix3d
function applyPhotoPerspective(){
  if (!photo.naturalWidth || !P.w){ photo.style.transform = ''; return; }
  const F = photoFrame();
  if (!isRect(settings.photo.corners) && !quadValid(quadFrom(F, settings.photo.corners)))
    settings.photo.corners = [[0,0],[0,0],[0,0],[0,0]];          // ungültige gespeicherte Ecken verwerfen
  const fw = F.aw * F.s0, fh = F.ah * F.s0;
  const toUnits = [1/F.s0, 0, -fw/2/F.s0,  0, 1/F.s0, -fh/2/F.s0,  0, 0, 1];
  const toLayer = [F.s0, 0, P.w/2,  0, F.s0, P.h/2,  0, 0, 1];
  const L = m3mul(m3mul(toLayer, perspHomography(F)), toUnits);
  photo.style.transform = `matrix3d(${L[0]},${L[3]},0,${L[6]},${L[1]},${L[4]},0,${L[7]},0,0,1,0,${L[2]},${L[5]},0,${L[8]})`;
}
// Gesamte Abbildung Foto-Einheiten -> Bildschirm und zurück
function computeGeom(){
  const p = settings.photo, F = photoFrame();
  const Hu = perspHomography(F);
  const k = p.scale * F.s0, r = p.rotation * Math.PI / 180;
  const cs = Math.cos(r) * k * V.s, sn = Math.sin(r) * k * V.s;
  const cx = P.left + P.w / 2 + p.x * P.w, cy = P.top + P.h / 2 + p.y * P.h;
  const A = [cs, -sn, V.tx + V.s * cx,  sn, cs, V.ty + V.s * cy,  0, 0, 1];   // Lage + Ansicht (ohne Perspektive)
  const Full = m3mul(A, Hu);
  const c0 = m3apply(Full, 0, 0) || { x: A[2], y: A[5] };
  return { F, Hu, A, Ainv: m3inv(A), Full, FullInv: m3orient(m3inv(Full), c0.x, c0.y) };
}

/* ---------- Raster ---------- */
// Liniensegmente in Foto-Einheiten; nur neu, wenn sich Felderzahl oder Seitenverhältnis ändern
function buildGrid(F){
  const n = settings.guides.grid.n, c = 1 / n, odd = n % 2 === 1;
  const key = n + '|' + F.aw.toFixed(5) + '|' + F.ah.toFixed(5);
  if (key === gridKey) return;
  gridKey = key;
  const pos = half => {
    const out = [-half, half];
    for (let k = odd ? 0.5 : 0; k * c < half - 1e-6; k++){ out.push(k * c); if (k !== 0) out.push(-k * c); }
    return [...new Set(out.map(x => +x.toFixed(6)))].sort((a, b) => a - b);
  };
  const hw = F.aw / 2, hh = F.ah / 2;
  gridSegs = [];
  for (const x of pos(hw)) gridSegs.push([x, -hh, x, hh]);      // senkrechte (links -> rechts)
  for (const y of pos(hh)) gridSegs.push([-hw, y, hw, y]);      // waagrechte (oben -> unten)
}
function applyGridStyle(){
  const g = settings.guides.grid;
  gridLine.setAttribute('stroke', GRID_COLORS[g.color] || '#000');
  gridLine.setAttribute('stroke-width', g.bold ? 2.2 : 1);
  gridKey = '';
}

/* ---------- Horizont ---------- */
// Horizont in Bildschirm-Koordinaten: Punkt m (Lot vom Bildschirmmittelpunkt) + Richtung
function horizonScreen(g){
  const h = settings.guides.horizon, a = h.angle * Math.PI / 180, dx = Math.cos(a), dy = Math.sin(a);
  const t = -(h.u * dx + h.v * dy), fu = h.u + t * dx, fv = h.v + t * dy;   // Fußpunkt nahe der Fotomitte
  const p0 = m3apply(g.Full, fu - dx * 0.25, fv - dy * 0.25), p1 = m3apply(g.Full, fu + dx * 0.25, fv + dy * 0.25);
  if (!p0 || !p1) return null;
  let sx = p1.x - p0.x, sy = p1.y - p0.y; const l = Math.hypot(sx, sy);
  if (l < 1e-9) return null;
  sx /= l; sy /= l;
  const cx = stage.clientWidth / 2, cy = stage.clientHeight / 2, tt = (cx - p0.x) * sx + (cy - p0.y) * sy;
  return { m: { x: p0.x + tt * sx, y: p0.y + tt * sy }, dx: sx, dy: sy };
}
// Linie aus Bildschirmpunkt + Richtung zurück in Foto-Einheiten speichern
function setHorizonFromScreen(g, m, dx, dy){
  if (!g.FullInv) return false;
  const a = m3apply(g.FullInv, m.x, m.y), b = m3apply(g.FullInv, m.x + dx * 40, m.y + dy * 40);
  if (!a || !b) return false;
  const h = settings.guides.horizon, cl = v => Math.max(-100, Math.min(100, v));
  h.u = cl(a.x); h.v = cl(a.y);
  const deg = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
  h.angle = ((deg % 360) + 540) % 360 - 180;
  return true;
}
function snapHorizon(screenDeg){
  const d = ((screenDeg % 180) + 270) % 180 - 90;   // auf (-90, 90] bringen
  return Math.abs(d) <= HOR_SNAP_DEG ? screenDeg - d : screenDeg;
}

/* ---------- Zeichnen aller Hilfslinien und Griffe ---------- */
function cornerScreens(g){
  return quadFrom(g.F, settings.photo.corners).map(q => m3apply(g.A, q[0], q[1]));
}
// Eckgriffe: diagonal nach außen versetzt, aber immer erreichbar (im Bildschirm, nicht unter Leiste/Einstellfeld)
function cornerHandlePos(S){
  const cx = (S[0].x + S[1].x + S[2].x + S[3].x) / 4, cy = (S[0].y + S[1].y + S[2].y + S[3].y) / 4;
  const M = 24, sw = stage.clientWidth, sh = stage.clientHeight, sr = stage.getBoundingClientRect();
  const obst = [];
  for (const el of [bar, modePanel, opPop, moreMenu, $('barToggle')]){
    if (!el || getComputedStyle(el).display === 'none' || (el === bar && bar.classList.contains('hidden'))) continue;
    const r = el.getBoundingClientRect();
    if (r.width && r.height) obst.push({ l: r.left - sr.left - M, t: r.top - sr.top - M, r: r.right - sr.left + M, b: r.bottom - sr.top + M });
  }
  return S.map(p => {
    const dx = p.x - cx, dy = p.y - cy, l = Math.hypot(dx, dy) || 1;
    let x = p.x + dx / l * CORNER_OFF, y = p.y + dy / l * CORNER_OFF;
    x = Math.min(sw - M, Math.max(M, x)); y = Math.min(sh - M, Math.max(M, y));
    const inside = (x, y) => obst.some(o => x > o.l && x < o.r && y > o.t && y < o.b);
    if (inside(x, y)){
      // nächste freie Stelle an einer Hinderniskante suchen (innerhalb des Bildschirms)
      const cand = [];
      for (const o of obst){
        cand.push({ x, y: o.t }, { x, y: o.b }, { x: o.l, y }, { x: o.r, y });
      }
      const ok = cand.filter(c => c.x >= M && c.x <= sw - M && c.y >= M && c.y <= sh - M && !inside(c.x, c.y));
      if (ok.length){
        ok.sort((a, b) => Math.hypot(a.x - x, a.y - y) - Math.hypot(b.x - x, b.y - y));
        x = ok[0].x; y = ok[0].y;
      }
    }
    return { x, y };
  });
}
const f2 = v => Math.round(v * 100) / 100;
function updateGuides(){
  if (!P.w) return;
  if (typeof markerDraw === 'function') markerDraw();
  const G = settings.guides, g = computeGeom();
  // Raster: Endpunkte abbilden, Linien gerade verbinden (bleiben unter Perspektive gerade)
  gridLine.style.display = G.grid.on ? '' : 'none';
  if (G.grid.on){
    buildGrid(g.F);
    let d = '';
    for (const s of gridSegs){
      const a = m3apply(g.Full, s[0], s[1]), b = m3apply(g.Full, s[2], s[3]);
      if (a && b) d += `M${f2(a.x)} ${f2(a.y)}L${f2(b.x)} ${f2(b.y)}`;
    }
    gridLine.setAttribute('d', d);
  }
  // Horizont
  const H = G.horizon.on ? horizonScreen(g) : null;
  horLine.style.display = H ? '' : 'none';
  handlesG.style.display = (H && settings.ui.mode === 'lines' && !settings.ui.locked) ? '' : 'none';
  if (H){
    const L = 4 * Math.max(stage.clientWidth, stage.clientHeight);
    horLine.setAttribute('d', `M${f2(H.m.x - H.dx * L)} ${f2(H.m.y - H.dy * L)}L${f2(H.m.x + H.dx * L)} ${f2(H.m.y + H.dy * L)}`);
    hMid.setAttribute('cx', H.m.x); hMid.setAttribute('cy', H.m.y);
    hEndA.setAttribute('cx', H.m.x - H.dx * HANDLE_DIST); hEndA.setAttribute('cy', H.m.y - H.dy * HANDLE_DIST);
    hEndB.setAttribute('cx', H.m.x + H.dx * HANDLE_DIST); hEndB.setAttribute('cy', H.m.y + H.dy * HANDLE_DIST);
  }
  // Eckgriffe (Perspektive)
  const showC = settings.ui.mode === 'align' && settings.ui.perspOn && !settings.ui.locked && !!photo.naturalWidth;
  cornerG.style.display = showC ? '' : 'none';
  if (showC){
    const S = cornerScreens(g), Hp = cornerHandlePos(S);
    for (let i = 0; i < 4; i++){
      cLinks[i].setAttribute('x1', S[i].x); cLinks[i].setAttribute('y1', S[i].y);
      cLinks[i].setAttribute('x2', Hp[i].x); cLinks[i].setAttribute('y2', Hp[i].y);
      cDots[i].setAttribute('cx', Hp[i].x); cDots[i].setAttribute('cy', Hp[i].y);
    }
  }
}

/* ---------- Griffe treffen und ziehen ---------- */
function hitHandle(pt){
  if (!settings.guides.horizon.on) return null;
  const H = horizonScreen(computeGeom());
  if (!H) return null;
  const cand = [
    { type: 'mid', x: H.m.x, y: H.m.y },
    { type: 'end', sign: -1, x: H.m.x - H.dx * HANDLE_DIST, y: H.m.y - H.dy * HANDLE_DIST },
    { type: 'end', sign:  1, x: H.m.x + H.dx * HANDLE_DIST, y: H.m.y + H.dy * HANDLE_DIST }
  ];
  let best = null, bd = HANDLE_HIT;
  for (const c of cand){ const d = Math.hypot(pt.x - c.x, pt.y - c.y); if (d <= bd){ bd = d; best = c; } }
  if (!best) return null;
  return { type: best.type, sign: best.sign || 0, last: { x: pt.x, y: pt.y }, pivot: { x: H.m.x, y: H.m.y } };
}
function moveLine(drag, pt){
  const g = computeGeom(), H = horizonScreen(g);
  if (!H) return;
  if (drag.type === 'mid'){
    setHorizonFromScreen(g, { x: H.m.x + pt.x - drag.last.x, y: H.m.y + pt.y - drag.last.y }, H.dx, H.dy);
    drag.last = { x: pt.x, y: pt.y };
  } else {
    // Neigen um den Mittelgriff (Stelle beim Anfassen)
    const dx = (pt.x - drag.pivot.x) * drag.sign, dy = (pt.y - drag.pivot.y) * drag.sign;
    if (Math.hypot(dx, dy) < 12) return;
    const a = snapHorizon(Math.atan2(dy, dx) * 180 / Math.PI) * Math.PI / 180;
    setHorizonFromScreen(g, drag.pivot, Math.cos(a), Math.sin(a));
  }
  updateGuides();
}
function hitCorner(pt){
  if (!(settings.ui.perspOn && photo.naturalWidth)) return null;
  const g = computeGeom(), S = cornerScreens(g), Hp = cornerHandlePos(S);
  let best = -1, bd = HANDLE_HIT;
  for (let i = 0; i < 4; i++){ const d = Math.hypot(pt.x - Hp[i].x, pt.y - Hp[i].y); if (d <= bd){ bd = d; best = i; } }
  if (best < 0) return null;
  return { i: best, grab: { x: pt.x - S[best].x, y: pt.y - S[best].y } };   // Abstand Finger -> Ecke bleibt fest
}
function moveCorner(drag, pt){
  const g = computeGeom();
  if (!g.Ainv) return;
  const q = m3apply(g.Ainv, pt.x - drag.grab.x, pt.y - drag.grab.y);
  if (!q) return;
  const R = rectCorners(g.F)[drag.i];
  const next = settings.photo.corners.map(c => [c[0], c[1]]);
  next[drag.i] = [Math.max(-10, Math.min(10, q.x - R[0])), Math.max(-10, Math.min(10, q.y - R[1]))];
  if (!quadValid(quadFrom(g.F, next))) return;      // ungültig: an der letzten gültigen Stelle bleiben
  settings.photo.corners = next;
  applyPhotoTransform();
  $('pPerspReset').disabled = false;
}

/* ---------- Einstellfeld (Ausrichten und Linien) ---------- */
function applyLinesPanel(){
  const G = settings.guides, m = settings.ui.mode;
  const hasSet = (m === 'lines' || m === 'align');
  const show = hasSet && settings.ui.barVisible && panelOpen;
  modePanel.classList.toggle('show', show);
  setBtn.disabled = !hasSet;
  setBtn.classList.toggle('on', show);
  modePanel.querySelectorAll('.pAlign').forEach(el => el.style.display = m === 'align' ? '' : 'none');
  modePanel.querySelectorAll('.pLines').forEach(el => el.style.display = m === 'lines' ? '' : 'none');
  const tog = (el, on) => { el.classList.toggle('on', on); el.setAttribute('aria-pressed', on); };
  tog($('gGrid'), G.grid.on); tog($('gBold'), G.grid.bold); tog($('gHor'), G.horizon.on);
  tog($('pPersp'), settings.ui.perspOn);
  tog($('mkOn'), settings.marker.on);
  $('mkLearn').classList.toggle('on', learnMode);
  $('mkTol').textContent = settings.marker.tol;
  $('mkMinus').disabled = settings.marker.tol <= 1; $('mkPlus').disabled = settings.marker.tol >= 10;
  const mcol = settings.marker.color;
  $('mkSwatch').style.background = mcol ? hsvCss(mcol) : 'transparent';
  $('pPerspReset').disabled = isRect(settings.photo.corners);
  $('gN').textContent = G.grid.n;
  $('gMinus').disabled = G.grid.n <= GRID_N_MIN; $('gPlus').disabled = G.grid.n >= GRID_N_MAX;
  modePanel.querySelectorAll('.sw').forEach(b => b.classList.toggle('on', b.dataset.c === G.grid.color));
  $('gLevel').disabled = !G.horizon.on;
  if (show) placePop(modePanel, setBtn);
}
// Feld neben der Leiste auf Höhe des auslösenden Symbols, im Bildschirm gehalten
function placePop(pop, btn){
  const r = btn.getBoundingClientRect(), h = pop.offsetHeight, H = window.innerHeight;
  const top = Math.max(8, Math.min(H - h - 8, r.top + r.height / 2 - h / 2));
  pop.style.top = top + 'px';
}
function guidesChanged(){ applyGridStyle(); applyLinesPanel(); updateGuides(); scheduleSave(); }
let panelOpen = false;   // Moduseinstellungen: Standard zu (nicht gespeichert)
setBtn.addEventListener('click', () => { closePops(); panelOpen = !panelOpen; applyLinesPanel(); updateGuides(); });
$('gGrid').addEventListener('click', () => { settings.guides.grid.on = !settings.guides.grid.on; guidesChanged(); });
$('gBold').addEventListener('click', () => { settings.guides.grid.bold = !settings.guides.grid.bold; guidesChanged(); });
$('gMinus').addEventListener('click', () => { settings.guides.grid.n = Math.max(GRID_N_MIN, settings.guides.grid.n - 1); guidesChanged(); });
$('gPlus').addEventListener('click', () => { settings.guides.grid.n = Math.min(GRID_N_MAX, settings.guides.grid.n + 1); guidesChanged(); });
modePanel.querySelectorAll('.sw').forEach(b => b.addEventListener('click', () => { settings.guides.grid.color = b.dataset.c; guidesChanged(); }));
$('gHor').addEventListener('click', () => { settings.guides.horizon.on = !settings.guides.horizon.on; guidesChanged(); });
$('gLevel').addEventListener('click', () => {
  // waagrecht auf dem Bildschirm/Papier, durch den aktuellen Mittelpunkt
  const g = computeGeom(), H = horizonScreen(g);
  if (!H || !setHorizonFromScreen(g, H.m, 1, 0)){
    const a = -settings.photo.rotation;
    Object.assign(settings.guides.horizon, { u: 0, v: 0, angle: ((a % 360) + 540) % 360 - 180 });
  }
  guidesChanged();
});
$('pPersp').addEventListener('click', () => { settings.ui.perspOn = !settings.ui.perspOn; applyLinesPanel(); updateGuides(); scheduleSave(); });
$('pPerspReset').addEventListener('click', () => {
  settings.photo.corners = [[0,0],[0,0],[0,0],[0,0]];
  applyPhotoTransform(); applyLinesPanel(); scheduleSave();
});

/* ================= Gesten ================= */
const pointers = new Map();   // id -> {x,y} aktuelle Bildschirmposition (Stage-lokal)
let gesture = null;           // {rawRot} während einer Geste
let tapInfo = null, lastTap = null;

function stagePoint(e){
  const r = stage.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}
// Bildschirm (Stage-lokal) -> Papier-Koordinaten (Pixel der Papier-Ebene ohne Zoom)
function toPaper(pt){
  return { x: (pt.x - V.tx) / V.s - P.left, y: (pt.y - V.ty) / V.s - P.top };
}
function snapRot(deg){
  const n = Math.round(deg / 90) * 90;
  return Math.abs(deg - n) <= SNAP_DEG ? n : deg;
}

function gesturesBlocked(){
  if (settings.ui.locked) return true;   // Sperre gilt für alle drei Modi
  if (settings.ui.mode === 'align' && !photo.naturalWidth) return true;   // ohne Foto nichts auszurichten
  return false;
}

function startGestureIfNeeded(){
  if (!gesture){
    gesture = { rawRot: settings.photo.rotation };
    view.classList.add('moving'); photoLayer.classList.add('moving');
  }
}
function endGesture(){
  if (gesture) scheduleSave();          // nach Ende einer Geste speichern
  gesture = null;
  view.classList.remove('moving'); photoLayer.classList.remove('moving');
}

// Wendet die Bewegung von "prev" nach "cur" an (je Map id->{x,y}), nur Finger die in beiden vorkommen
function applyMove(prev, cur){
  const ids = [...cur.keys()].filter(id => prev.has(id)).slice(0, 2);
  if (!ids.length) return;
  const m = settings.ui.mode;
  if (m === 'align'){
    if (ids.length === 2){ if (gesture) gesture.cornerDrag = null; moveAlign(ids, prev, cur); }
    else if (gesture && gesture.cornerDrag) moveCorner(gesture.cornerDrag, cur.get(ids[0]));
    else moveAlign(ids, prev, cur);
  }
  else if (m === 'draw') moveDraw(ids, prev, cur);
  else {                                         // Linien: 2 Finger = Ansicht, 1 Finger = Griff
    if (ids.length === 2){ if (gesture) gesture.lineDrag = null; moveDraw(ids, prev, cur); }
    else if (gesture && gesture.lineDrag) moveLine(gesture.lineDrag, cur.get(ids[0]));
  }
}

function moveAlign(ids, prev, cur){
  const p = settings.photo;
  let pc = { x: P.w / 2 + p.x * P.w, y: P.h / 2 + p.y * P.h };   // Fotomitte in Papier-Pixeln
  if (ids.length === 1){
    const a0 = toPaper(prev.get(ids[0])), a1 = toPaper(cur.get(ids[0]));
    pc.x += a1.x - a0.x; pc.y += a1.y - a0.y;
  } else {
    const a0 = toPaper(prev.get(ids[0])), b0 = toPaper(prev.get(ids[1]));
    const a1 = toPaper(cur.get(ids[0])),  b1 = toPaper(cur.get(ids[1]));
    const d0x = b0.x - a0.x, d0y = b0.y - a0.y, d1x = b1.x - a1.x, d1y = b1.y - a1.y;
    const l0 = Math.hypot(d0x, d0y), l1 = Math.hypot(d1x, d1y);
    if (l0 < 1 || l1 < 1) return;
    let ds = l1 / l0;
    const newScale = Math.min(PHOTO_MAX, Math.max(PHOTO_MIN, p.scale * ds));
    ds = newScale / p.scale;
    let dth = Math.atan2(d1y, d1x) - Math.atan2(d0y, d0x);
    if (dth > Math.PI) dth -= 2 * Math.PI;          // Sprung über ±180° vermeiden
    else if (dth < -Math.PI) dth += 2 * Math.PI;
    const m0 = { x: (a0.x + b0.x) / 2, y: (a0.y + b0.y) / 2 };
    const m1 = { x: (a1.x + b1.x) / 2, y: (a1.y + b1.y) / 2 };
    const rx = pc.x - m0.x, ry = pc.y - m0.y, c = Math.cos(dth), s = Math.sin(dth);
    pc = { x: m1.x + ds * (c * rx - s * ry), y: m1.y + ds * (s * rx + c * ry) };
    p.scale = newScale;
    gesture.rawRot += dth * 180 / Math.PI;
    p.rotation = snapRot(gesture.rawRot);
  }
  p.x = (pc.x - P.w / 2) / P.w;
  p.y = (pc.y - P.h / 2) / P.h;
  applyPhotoTransform();
}

function moveDraw(ids, prev, cur){
  const v = { s: V.s, tx: V.tx, ty: V.ty };
  if (ids.length === 1){
    if (v.s <= 1.0001) return;                    // ungezoomt: nichts zu verschieben
    const a0 = prev.get(ids[0]), a1 = cur.get(ids[0]);
    v.tx += a1.x - a0.x; v.ty += a1.y - a0.y;
  } else {
    const a0 = prev.get(ids[0]), b0 = prev.get(ids[1]);
    const a1 = cur.get(ids[0]),  b1 = cur.get(ids[1]);
    const l0 = Math.hypot(b0.x - a0.x, b0.y - a0.y), l1 = Math.hypot(b1.x - a1.x, b1.y - a1.y);
    if (l0 < 1 || l1 < 1) return;
    const m0 = { x: (a0.x + b0.x) / 2, y: (a0.y + b0.y) / 2 };
    const m1 = { x: (a1.x + b1.x) / 2, y: (a1.y + b1.y) / 2 };
    const sNew = Math.min(VIEW_MAX, Math.max(VIEW_MIN, v.s * l1 / l0));
    // Stage-Punkt unter der alten Fingermitte bleibt unter der neuen Fingermitte
    const qx = (m0.x - v.tx) / v.s, qy = (m0.y - v.ty) / v.s;
    v.s = sNew; v.tx = m1.x - sNew * qx; v.ty = m1.y - sNew * qy;
  }
  clampView(v);
  storeView(v);
  applyViewTransform();
}

function resetView(){
  settings.view = { cx: 0.5, cy: 0.5, scale: 1 };
  applyViewTransform();
  scheduleSave();
}

stage.addEventListener('pointerdown', e => {
  if (learnMode){ learnMode = false; learnAt(stagePoint(e)); return; }   // Marker-Farbe anlernen
  if (gesturesBlocked()) return;
  try { stage.setPointerCapture(e.pointerId); } catch(err){}
  pointers.set(e.pointerId, stagePoint(e));
  startGestureIfNeeded();
  if (settings.ui.mode === 'lines'){
    gesture.lineDrag = (pointers.size === 1) ? hitHandle(stagePoint(e)) : null;
  }
  if (settings.ui.mode === 'align'){
    gesture.cornerDrag = (pointers.size === 1 && settings.ui.perspOn) ? hitCorner(stagePoint(e)) : null;
  }
  if (pointers.size === 1) tapInfo = { t: performance.now(), p: stagePoint(e), moved: false };
  else tapInfo = null;
});
stage.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId)) return;
  if (gesturesBlocked()){ pointers.clear(); endGesture(); return; }
  const prev = new Map(pointers);
  const pt = stagePoint(e);
  pointers.set(e.pointerId, pt);
  if (tapInfo && Math.hypot(pt.x - tapInfo.p.x, pt.y - tapInfo.p.y) > 10) tapInfo.moved = true;
  applyMove(prev, pointers);
});
let singleTapTimer = null, lastPopClose = 0;
function pointerEnd(e){
  if (!pointers.has(e.pointerId)) return;
  pointers.delete(e.pointerId);
  // Doppeltippen im Zeichnen-Modus -> Gesamtansicht
  if (e.type === 'pointerup' && pointers.size === 0 && tapInfo && !tapInfo.moved &&
      performance.now() - tapInfo.t < 300){
    const now = performance.now();
    if (lastTap && now - lastTap.t < 350 && Math.hypot(tapInfo.p.x - lastTap.p.x, tapInfo.p.y - lastTap.p.y) < 40){
      clearTimeout(singleTapTimer);      // war ein Doppeltipp: Bedienung nicht umschalten
      if (settings.ui.mode === 'draw' && !settings.ui.locked) resetView();
      lastTap = null;
    } else {
      lastTap = { t: now, p: tapInfo.p };
      // Einfacher Tipp im Zeichnen-Modus: Bedienung aus-/einblenden (kurz warten, ob ein zweiter Tipp folgt)
      if (settings.ui.mode === 'draw' && !settings.ui.locked && now - lastPopClose > 600){
        clearTimeout(singleTapTimer);
        singleTapTimer = setTimeout(() => {
          if (settings.ui.mode !== 'draw') return;
          settings.ui.barVisible = !settings.ui.barVisible; applyBar(); scheduleSave();
        }, 360);
      }
    }
  }
  if (pointers.size === 0){ tapInfo = null; endGesture(); }
}
stage.addEventListener('pointerup', pointerEnd);
stage.addEventListener('pointercancel', pointerEnd);

let wakeLock = null;
async function requestWakeLock(){
  if (!('wakeLock' in navigator) || document.hidden || !stream) return;
  if (wakeLock && !wakeLock.released) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { if (info.classList.contains('show')) renderInfo(); });
  } catch(e){ wakeLock = null; }
}
function releaseWakeLock(){
  try { if (wakeLock && !wakeLock.released) wakeLock.release(); } catch(e){}
  wakeLock = null;
}

/* ================= Kamera ================= */
function cameraErrorText(e){
  const n = e && e.name;
  if (n === 'NotAllowedError' || n === 'SecurityError' || n === 'PermissionDeniedError')
    return 'Kamerazugriff verweigert. Erlaube die Kamera in den Website-Einstellungen des Browsers (Schloss-Symbol neben der Adresse) und tippe erneut auf „Kamera starten“.';
  if (n === 'NotFoundError' || n === 'OverconstrainedError' || n === 'DevicesNotFoundError')
    return 'Keine Kamera gefunden. Dieses Gerät hat keine nutzbare Kamera.';
  if (n === 'NotReadableError' || n === 'TrackStartError' || n === 'AbortError')
    return 'Die Kamera ist belegt oder lässt sich nicht starten. Schließe andere Apps, die die Kamera nutzen, und versuche es erneut.';
  return 'Die Kamera konnte nicht gestartet werden' + (n ? ' (' + n + ')' : '') + '.';
}

function stopCamera(){
  if (stream){ stream.getTracks().forEach(t => { try { t.stop(); } catch(e){} }); }
  stream = null;
  cam.srcObject = null;
  cam.style.display = 'none';
  camBtn.classList.remove('on');
  $('camLbl').textContent = 'Kamera starten';
  releaseWakeLock();
  layout(); updateHint();
  if (typeof mkUpdateLoop === 'function'){ mkUpdateLoop(); applyFocusUi(); }
}

async function startCamera(opts){
  const silent = !!(opts && opts.silent === true);   // Autostart: Fehler nicht anzeigen
  if (!silent) hideMsg();
  if (!window.isSecureContext){
    if (silent) return;
    showMsg('Keine sichere Verbindung (kein https). Die Kamera funktioniert nur über https://, z. B. https://qllimaxx.github.io/zeichenhilfe/', true);
    return;
  }
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    if (silent) return;
    showMsg('Dieser Browser erlaubt hier keinen Kamerazugriff.', true);
    return;
  }
  stopCamera();
  camBtn.disabled = true; $('camLbl').textContent = 'Kamera startet …';

  // Reihenfolge: Rückkamera mit hoher Auflösung → irgendeine Kamera hoch → irgendeine Kamera
  const res = { width: { ideal: 1920 }, height: { ideal: 1080 } };
  const attempts = [
    { audio: false, video: Object.assign({ facingMode: { exact: 'environment' } }, res) },
    { audio: false, video: Object.assign({ facingMode: { ideal: 'environment' } }, res) },
    { audio: false, video: res },
    { audio: false, video: true }
  ];
  let s = null, lastErr = null;
  for (const c of attempts){
    try { s = await navigator.mediaDevices.getUserMedia(c); break; }
    catch(e){
      lastErr = e;
      if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) break;  // kein Sinn weiterzuprobieren
    }
  }
  camBtn.disabled = false; $('camLbl').textContent = 'Kamera starten';
  if (!s){ if (!silent) showMsg(cameraErrorText(lastErr), true); return; }

  stream = s;
  camWasRunning = false;
  const track = stream.getVideoTracks()[0];
  if (track) track.addEventListener('ended', () => {
    if (stream){ stopCamera(); showMsg('Die Kamera wurde beendet. Tippe auf „Kamera“.', true); }
  });
  cam.srcObject = stream;
  cam.style.display = 'block';
  camBtn.classList.add('on');
  $('camLbl').textContent = 'Kamera neu starten';
  try { await cam.play(); } catch(e){ /* autoplay ist muted; Fehler hier ignorieren */ }
  updateHint(); scheduleLayout();
  requestWakeLock();
  readFocus();
  if (settings.ui.focusFixed) applyFocus(true);   // gespeicherten Wunsch still anwenden
  applyFocusUi();
  mkUpdateLoop();
}
camBtn.addEventListener('click', () => startCamera());

// Kamera beim Verstecken stoppen, danach neu startbar; Wake Lock nach Rückkehr neu anfordern
document.addEventListener('visibilitychange', () => {
  if (document.hidden){
    flushSave();
    if (stream){ camWasRunning = true; stopCamera(); }
  } else {
    if (stream) requestWakeLock();
    if (camWasRunning) showMsg('Kamera wurde pausiert, während die App im Hintergrund war. Tippe auf „Kamera“.', false);
  }
});

// Bild-Datei/Blob laden (nur lokal), liefert das geladene <img>
function loadImage(blob){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    const im = new Image();
    im.onload = () => resolve({ im, url });
    im.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Bild nicht lesbar')); };
    im.src = url;
  });
}
// Große Fotos (lange Seite > 4096 px) als JPEG verkleinern, kleine unverändert lassen
async function preparePhoto(file){
  const { im, url } = await loadImage(file);
  const w = im.naturalWidth, h = im.naturalHeight, long = Math.max(w, h);
  if (long <= PHOTO_MAX_SIDE){ URL.revokeObjectURL(url); return { blob: file, w, h, resized: false }; }
  const k = PHOTO_MAX_SIDE / long, nw = Math.round(w * k), nh = Math.round(h * k);
  const c = document.createElement('canvas'); c.width = nw; c.height = nh;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(im, 0, 0, nw, nh);
  URL.revokeObjectURL(url);
  const blob = await new Promise(res => c.toBlob(res, 'image/jpeg', 0.92));
  c.width = c.height = 0;   // Speicher freigeben
  if (!blob) return { blob: file, w, h, resized: false };   // Rückfall: Original
  return { blob, w: nw, h: nh, resized: true };
}
// Foto anzeigen (aus Blob)
function showPhotoBlob(blob){
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(blob);
    photo.onload = () => {
      if (photoUrl && photoUrl !== url) URL.revokeObjectURL(photoUrl);
      photoUrl = url;
      photo.style.display = 'block';
      fitPhoto(); applyPhotoTransform(); updateHint();
      resolve();
    };
    photo.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Bild nicht lesbar')); };
    photo.src = url;
  });
}
function clearPhotoDisplay(){
  photo.onload = photo.onerror = null;
  photo.removeAttribute('src');
  photo.style.display = 'none';
  if (photoUrl){ URL.revokeObjectURL(photoUrl); photoUrl = null; }
  updateHint();
  updateGuides();                        // Hilfslinien beziehen sich jetzt auf die gedachte Papierfläche
}
fileIn.addEventListener('change', async () => {
  const f = fileIn.files && fileIn.files[0];
  if (!f) return;
  let prep;
  try {
    prep = await preparePhoto(f);
    await showPhotoBlob(prep.blob);
    hideMsg();
  } catch(e){
    showMsg('Das Bild konnte nicht geladen werden. Bitte ein anderes Foto (z. B. JPG oder PNG) wählen.', true);
    return;
  }
  // Nur das zuletzt gewählte Foto behalten
  const ok = await idbPut(PHOTO_KEY, { blob: prep.blob, w: prep.w, h: prep.h, type: prep.blob.type || '', savedAt: Date.now() });
  if (ok) requestPersist();
});

/* ================= Info / Diagnose ================= */
const yn = b => b ? '<span class="ja">ja</span>' : '<span class="nein">nein</span>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function renderInfo(){
  let devCount = '–';
  try {
    if (navigator.mediaDevices && navigator.mediaDevices.enumerateDevices){
      const d = await navigator.mediaDevices.enumerateDevices();
      devCount = d.filter(x => x.kind === 'videoinput').length;
    }
  } catch(e){}
  let camRow = yn(false);
  let camType = '–';
  if (stream && cam.videoWidth){
    camRow = yn(true) + ' (' + cam.videoWidth + ' × ' + cam.videoHeight + ' Pixel)';
    try {
      const st = stream.getVideoTracks()[0].getSettings();
      camType = st.facingMode === 'environment' ? 'Rückkamera'
              : st.facingMode === 'user' ? 'Frontkamera' : 'unbekannt';
    } catch(e){}
  }
  const wl = !('wakeLock' in navigator) ? '<span class="nein">nicht verfügbar</span>'
           : wakeLockActive() ? '<span class="ja">aktiv</span>' : '<span class="nein">nicht aktiv</span>';
  const fs = !fsSupported ? '<span class="nein">nicht unterstützt</span>' : (isFs() ? 'an' : 'aus');
  const rows = [
    ['Version', esc(APP_VERSION)],
    ['Sichere Verbindung (https)', yn(window.isSecureContext)],
    ['Kameras am Gerät', esc(devCount)],
    ['Kamera aktiv', camRow],
    ['Kamera-Typ', esc(camType)],
    ['Wake Lock verfügbar', yn('wakeLock' in navigator)],
    ['Bildschirm bleibt an', wl],
    ['Vollbild', fs],
    ['Drehung gesperrt', !orientSupported ? '<span class="nein">nicht unterstützt</span>' : (orientLocked ? 'ja' : 'nein')],
    ['Läuft als installierte App', yn(isInstalledApp())],
    ['Offline-Speicher (Service Worker)', swActive() ? '<span class="ja">aktiv</span>' : '<span class="nein">nicht aktiv</span>'],
    ['Bildschirm', esc(innerWidth + ' × ' + innerHeight + ' (Pixeldichte ' + (window.devicePixelRatio || 1) + ')')],
    ['Fokus-Modi', esc(stream ? (focusInfo.modes.length ? focusInfo.modes.join(', ') : 'keine Angabe') : '– (Kamera aus)')],
    ['Fokus aktuell', esc((focusInfo.current || '–') + (settings.ui.focusFixed ? ' (fixiert gewünscht)' : ''))],
    ['Fokus-Entfernung', esc(typeof focusInfo.dist === 'number' ? focusInfo.dist.toFixed(3) : '–')],
    ['Marker-Erkennung', esc(mkRunning ? (mkState.fps.toFixed(1).replace('.', ',') + ' /s · ' + mkState.ms.toFixed(1).replace('.', ',') + ' ms pro Bild · ' + mkState.blobs + ' Flecken vor Filter') : 'aus')]
  ];
  infoBody.innerHTML = rows.map(r => '<tr><td>' + r[0] + '</td><td>' + r[1] + '</td></tr>').join('');
  // Daten
  const rec = await idbGet(PHOTO_KEY);
  const hasPhoto = !!(rec && rec.blob);
  const fmtSize = b => b >= 1048576 ? (b / 1048576).toFixed(1).replace('.', ',') + ' MB' : Math.max(1, Math.round(b / 1024)) + ' KB';
  const pers = await isPersisted();
  const meta = lsGet(META_KEY);
  const drows = [

/* ================= Fokus fixieren ================= */
const focusBtn = $('focusBtn');
let focusInfo = { modes: [], current: null, dist: null, caps: {} };
function camTrack(){ return stream ? stream.getVideoTracks()[0] : null; }
function readFocus(){
  const tr = camTrack();
  focusInfo = { modes: [], current: null, dist: null, caps: {} };
  if (!tr) return focusInfo;
  try {
    const caps = tr.getCapabilities ? tr.getCapabilities() : {};
    const st = tr.getSettings ? tr.getSettings() : {};
    focusInfo.caps = caps || {};
    focusInfo.modes = Array.isArray(caps && caps.focusMode) ? caps.focusMode.slice() : [];
    focusInfo.current = st.focusMode || null;
    focusInfo.dist = (typeof st.focusDistance === 'number') ? st.focusDistance : null;
  } catch(e){}
  return focusInfo;
}
const focusSupported = () => focusInfo.modes.includes('manual') || focusInfo.modes.includes('single-shot');
// Fixieren: manual + aktuelle Entfernung, sonst single-shot. Frei: continuous.
async function applyFocus(fixed){
  const tr = camTrack();
  if (!tr) return 'nocam';
  readFocus();
  const m = focusInfo.modes;
  try {
    if (fixed){
      if (m.includes('manual') && focusInfo.caps.focusDistance && typeof focusInfo.dist === 'number')
        await tr.applyConstraints({ advanced: [{ focusMode: 'manual', focusDistance: focusInfo.dist }] });
      else if (m.includes('single-shot'))
        await tr.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] });
      else if (m.includes('manual'))
        await tr.applyConstraints({ advanced: [{ focusMode: 'manual' }] });
      else return 'unsupported';
    } else if (m.includes('continuous')){
      await tr.applyConstraints({ advanced: [{ focusMode: 'continuous' }] });
    }
    readFocus();
    return 'ok';
  } catch(e){ readFocus(); return 'error'; }
}
function applyFocusUi(){
  const on = settings.ui.focusFixed;
  focusBtn.classList.toggle('on', on);
  focusBtn.setAttribute('aria-pressed', on);
  $('focusLbl').textContent = on ? 'Fokus frei' : 'Fokus fixieren';
  focusBtn.disabled = !!(stream && !on && !focusSupported());   // Kamera läuft, Gerät kann es nicht: ausgegraut
}
focusBtn.addEventListener('click', async () => {
  const want = !settings.ui.focusFixed;
  if (!stream){
    settings.ui.focusFixed = want;
    showToast(want ? 'Fokus wird beim Kamerastart fixiert' : 'Fokus frei');
  } else {
    const r = await applyFocus(want);
    if (want && r !== 'ok'){ showMsg('Fokus lässt sich auf diesem Gerät nicht fixieren.', false); settings.ui.focusFixed = false; }
    else { settings.ui.focusFixed = want; showToast(want ? 'Fokus fixiert' : 'Fokus frei'); }
